<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVO Pitwall</title>
<link rel="icon" href="pitwall.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside id="side">
  <div class="brand">
    <svg class="stripes" viewBox="0 0 26 18" aria-hidden="true">
      <rect x="0" y="0" width="6" height="18" rx="1.5" fill="#d9a83e"/>
      <rect x="10" y="3" width="6" height="15" rx="1.5" fill="#c23b3b"/>
      <rect x="20" y="6" width="6" height="12" rx="1.5" fill="#4d9fdb"/>
    </svg>
    <div class="t"><b>EVO Pitwall</b><span>Carriera · Setup · Telemetria</span></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">Assetto Corsa EVO · tool locale<br>tutto resta sul tuo PC</div>
</aside>

<div id="shell">
  <header id="top">
    <div class="in">
      <div class="idblock hidden" id="idblock">
        <div class="avatar" id="t-ava">–</div>
        <div>
          <div class="nm" id="t-name">–</div>
          <div class="sub" id="t-sub">–</div>
        </div>
      </div>
      <div class="hstats hidden" id="hstats">
        <div class="hstat"><span class="l">Data</span><span class="v" id="t-date" title="la data di gioco della carriera (calendario continuo: avanza a ogni gara)">–</span></div>
        <div class="hstat"><span class="l">Finanze</span><span class="v money" id="t-money">–</span></div>
        <div class="hstat"><span class="l">Reputazione</span><span class="v rep" id="t-rep">–</span></div>
        <div class="hstat" id="hstat-level" style="display:none;cursor:pointer"><span class="l">Livello</span><span class="v" id="t-level" style="font-size:12.5px;font-weight:700"></span></div>
        <div class="hstat"><span class="l">Stagione</span><span class="v" id="t-season">–</span></div>
        <div class="hstat" id="hstat-heritage" style="display:none"><span class="l">Eredità</span><span class="v" id="t-heritage" title="capitoli di famiglia completati">–</span></div>
        <div class="hstat" id="hstat-nextrace" style="display:none;cursor:pointer"><span class="l">Prossima gara</span><span class="v" id="t-nextrace" style="font-size:12.5px;font-weight:600">–</span></div>
        <div class="hstat"><span class="l">Gioco</span><span class="v" style="font-size:12.5px;font-weight:500"><span class="dot" id="dot-evo"></span><span id="t-evo">chiuso</span></span></div>
        <div class="hstat"><span class="l">MoTeC</span><span class="v" style="font-size:12.5px;font-weight:500"><span class="chip hidden" id="motec-strip"></span></span></div>
        <div class="hstat"><span class="l">Voce</span><span class="v" style="font-size:12.5px;font-weight:500"><span class="chip" id="copilot-strip" style="cursor:pointer"></span> <span class="chip" id="copilot-prova" style="cursor:pointer" title="Prova la radio VERA della gara (voce del Pitwall) e, se è spenta, la voce della copilota del browser: dice una frase in italiano e ti mostra quale voce del sistema ha usato.">♪ prova</span></span></div>
      <div class="hstat" style="border-right:0"><span class="l">In pista</span><span class="v" style="font-size:12.5px;font-weight:500"><span class="chip hidden" id="live-strip"></span></span></div>
      </div>
    </div>
  </header>
  <div id="aggbar" style="padding:0 14px"></div>
  <!-- FILBAR DI SERVIZIO (5/11): serve quando il server webui non risponde o
       gira con il codice vecchio (Node non ricarica da solo). Nato nascosto:
       lo gestisce core.js (api che fallisce → visibile, server tornato → via). -->
  <div id="filbar" hidden style="padding:8px 14px"></div>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="js/lang.js"></script>
<script src="js/core.js"></script>
<script src="js/meccanico.js"></script>
<script src="js/narratore-unito.js"></script><!-- il NUCLEO dei narratori: UNA sola copia, la usa anche il server (voce Pitwall) e i test -->
<script src="js/viste-a.js"></script>
<script src="js/viste-b.js"></script>
<script src="js/viste-c.js"></script>
<script src="js/viste-d.js"></script>
<script src="js/viste-analisi.js"></script>
<script src="js/viste-griglia.js"></script>
</body>
</html>
