      ${c.image?`<img class="car-frame" src="${c.image}" alt="${esc(c.carName)}" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0d1118">`:''}
      <div style="padding:9px 11px">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b style="font-size:13px">${esc(c.carName)}</b> ${badge(c.how, c.note)}${c.pi!=null?`<span class="tag blue" style="font-size:10px;padding:1px 6px" title="Perf. index dal server dedicato">PI ${c.pi.toFixed(1)}</span>`:''}</div>
        <div class="muted" style="font-size:11px;margin-top:3px">nel garage dal ${esc(new Date(c.since).toLocaleDateString('it-IT'))}${c.note?` · ${esc(c.note)}`:''}</div>
        <div style="display:flex;gap:10px;margin-top:7px;font-size:12px;flex-wrap:wrap">
          <span title="gare con questa auto">🏁 ${c.stats.races} gare</span>
          <span title="vittorie" style="color:var(--good)">🥇 ${c.stats.wins}</span>
          <span title="podio">🎯 ${c.stats.podiums}</span>
          <span title="chilometri percorsi in gara con noi (giri × lunghezza pista)">🛣 ${money(c.stats.km)} km</span>
          ${c.stats.bestLap?`<span class="muted" title="miglior giro in carriera">⏱ ${esc(c.stats.bestLap)}</span>`:''}
        </div>
        <div style="margin-top:7px;font-size:12px"><b>valutata ${money(c.value)} €</b> <span class="muted" style="font-size:10.5px" title="prezzo reale svalutato dai km (${Math.round(c.valueFactor*100)}%)">${c.realPrice!=null?`(nuova ~${money(c.realPrice)} €)`:''}</span> · <span style="color:var(--good)">vendita ${money(c.sale)} €</span></div>
        <div class="row" style="margin-top:8px;gap:6px">
          <input class="g-note" type="text" placeholder="nota (es. livrea, assetto…)..." value="${esc(c.note ?? '')}" style="flex:1;min-width:120px;font-size:11px">
          <button class="mini g-savenote">salva</button>
          <button class="mini g-sell" title="vendi al 70% della valutazione">vendi</button>
          <button class="mini g-del" style="border-color:var(--bad)" title="togli dal garage senza soldi">✕</button>
        </div>
      </div>
    </div>`).join('') || '<div class="empty">Garage vuoto: vinci un evento speciale o aggiungi un\'auto dal catalogo.</div>';
    $$('#g-grid .g-savenote').forEach(b => b.onclick = async () => {
      const card = b.closest('[data-car]');
      try { const out = await api('garage-note', { carId: card.dataset.car, note: $('.g-note', card).value }); draw(out.garage); toast('Nota salvata.', 'ok'); }
      catch(e){ toast(e.message, 'err'); }
    });
    $$('#g-grid .g-del').forEach(b => b.onclick = async () => {
      const card = b.closest('[data-car]');
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'sicuro?'; setTimeout(()=>{ b.dataset.armed=''; b.textContent='✕'; }, 2500); return; }
      try { const out = await api('garage-remove', { carId: card.dataset.car }); draw(out.garage); toast('Auto tolta dal garage.', 'ok'); }
      catch(e){ toast(e.message, 'err'); }
    });
    $$('#g-grid .g-sell').forEach(b => b.onclick = async () => {
      const card = b.closest('[data-car]');
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.style.borderColor = 'var(--bad)'; b.textContent = 'confermi?'; setTimeout(()=>{ b.dataset.armed=''; b.style.borderColor=''; b.textContent='vendi'; }, 3000); return; }
      try {
        const out = await api('garage-sell', { carId: card.dataset.car });
        draw(out.garage); paintHeader(out.header); refreshBoot();
        toast(`Venduta: +${money(out.sold.gain)} € (${money(out.sold.km)} km).`, 'ok');
      }
      catch(e){ toast(e.message, 'err'); }
    });
  };
  draw(g);
  $('#g-addbtn').onclick = async () => {
    const sel = $('#g-add');
    if (!sel.value) return toast("Scegli prima un'auto dal menu.", 'err');
    try {
      const out = await api('garage-add', { carId: sel.value, carName: sel.selectedOptions[0].dataset.name, how: $('#g-how').value });
      sel.value = ''; draw(out.garage); toast(out.reused ? "Auto già in garage." : 'Auto aggiunta al garage.', out.reused ? 'info' : 'ok');
    } catch(e){ toast(e.message, 'err'); }
  };
}

/* -------- libro delle piste -------- */
async function drawTracks(m){
  const t = await api('tracks');
  const lapMs = (s) => { const m = String(s??'').match(/^(\d+):(\d{2})\.(\d{3})$/); return m ? (+m[1])*60000 + (+m[2])*1000 + (+m[3]) : null; };
  const flag = (c) => ({ 'Italia':'🇮🇹','Giappone':'🇯🇵','Austria':'🇦🇹','Australia':'🇦🇺','Germania':'🇩🇪','Stati Uniti':'🇺🇸' }[c] ?? '🏁');
  const rows = t.rows.map((r) => `<tr>
    <td><b>${flag(r.info?.country)} ${esc(r.track)}</b>${r.id===t.next?.id?` <span class="tag gold" style="font-size:10px;padding:1px 6px">prossima</span>`:''}${r.inLadder?'':' <span class="faint">(fuori ladder)</span>'}</td>
    <td class="muted">${r.info?esc(r.info.nick):'—'}</td>
    <td class="right"><b>${r.personal?esc(r.personal.time):'—'}</b>${r.personal?`<br><span class="faint" style="font-size:11px">${esc(r.personal.car??'')}</span>`:''}</td>
    <td class="right">${r.session?`<b>${esc(r.session.time)}</b> <span class="faint">${esc(r.session.driver)}${r.session.mine?' (tu)':''}</span>`:'—'}</td>
    <td class="right">${(() => { const a=lapMs(r.personal?.time), b=lapMs(r.session?.time); return (a&&b)?(b<a?`<span class="tag gold" style="font-size:10px;padding:1px 6px">−${((a-b)/1000).toFixed(3)}</span>`:`<span class="tag green" style="font-size:10px;padding:1px 6px">+${((b-a)/1000).toFixed(3)}</span>`):'—'; })()}</td>
    <td>${r.layoutRows?.length>1?`<button class="mini" data-lay="${esc(r.id)}">layout</button> `:''}${r.info?`<button class="mini" data-hist="${esc(r.id)}">storia</button>`:''}</td>
  </tr>`).join('');
  m.innerHTML = `
  <div class="panel">
    <h2>Libro delle piste <span class="h-act">record personali e di sessione, per tracciato e per layout, con la storia di ogni pista</span></h2>
    <div class="muted" style="margin-bottom:10px">Il <b>record personale</b> è il tuo miglior giro (carriera + prove). Il <b>record di sessione</b> è il migliore mai visto nei risultati sulla stessa auto (tuo o di un rivale: è il tempo da battere). Per le piste con più configurazioni il pulsante <b>layout</b> apre i tempi di ognuna.</div>
    <table><thead><tr><th>Pista</th><th>Soprannome</th><th class="right">Tuo record</th><th class="right">Record di sessione</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>
  <div id="track-hist"></div>`;
  $$('button[data-hist]').forEach((b) => b.onclick = () => {
    const r = t.rows.find((x) => x.id === b.dataset.hist);
    const i = r?.info;
    $('#track-hist').innerHTML = !i ? '' : `<div class="panel" style="margin-top:14px"><h2>${flag(i.country)} ${esc(i.fullName)} <span class="h-act">${esc(i.country)} · ${i.lengthKm} km · ${i.corners} curve · inaugurato nel ${i.opened}</span></h2>
      ${i.photo ? `<img src="${i.photo}" alt="vista aerea di ${esc(r.track)}" style="width:100%;max-width:520px;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:10px;margin-bottom:10px">` : (i.map ? `<img src="${i.map}" alt="tracciato ${esc(r.track)}" style="width:100%;max-width:420px;object-fit:contain;background:#000;border-radius:10px;padding:12px;margin-bottom:10px${i.map.endsWith('.svg')?';filter:invert(1);opacity:.92':''}">` : '')}
      ${r.layoutRows?.length ? `<table style="margin-bottom:10px"><thead><tr><th>Layout</th><th class="right">Lunghezza</th><th class="right">Box</th><th class="right">Tuo miglior</th><th class="right">Record di sessione</th></tr></thead><tbody>${r.layoutRows.map(l=>`<tr><td><b>${esc(l.layout)}</b></td><td class="right">${l.lengthKm??'—'} km</td><td class="right">${l.pits??'—'}</td><td class="right">${l.mine?`<b>${esc(l.mine.time)}</b>${l.mineFallback?'<span class="faint"> *</span>':''}`:'—'}</td><td class="right">${l.session?`${esc(l.session.time)} <span class="faint">${esc(l.session.driver)}</span>`:'—'}</td></tr>`).join('')}</tbody></table>${r.layoutRows.some(l=>l.mineFallback)?'<div class="faint" style="margin:-6px 0 10px;font-size:11px">* dal record personale in carriera/prove (una sola configurazione corsa: il save non distingue i layout)</div>':''}` : ''}
      <div style="line-height:1.6">${esc(i.history)}</div></div>`;
    $('#track-hist').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $$('button[data-lay]').forEach((b) => {
    const r = t.rows.find((x) => x.id === b.dataset.lay);
    if (!r) return;
    const rows = (r.layoutRows ?? []).map((l) => `<tr>
      <td><b>${esc(l.layout)}</b></td>
      <td class="right muted">${l.lengthKm!=null?l.lengthKm+' km':'—'}</td>
      <td class="right muted">${l.pits??'—'}</td>
      <td class="right">${l.mine?`<b>${esc(l.mine.time)}</b>${l.mineFallback?'<span class="faint"> *</span>':''}<br><span class="faint" style="font-size:11px">${esc(l.mine.car??'')}</span>`:'—'}</td>
      <td class="right">${l.session?`<b>${esc(l.session.time)}</b> <span class="faint">${esc(l.session.driver)}${l.session.mine?' (tu)':''}</span><br><span class="faint" style="font-size:11px">${esc(l.session.car??'')}</span>`:'—'}</td>
    </tr>`).join('');
    $('#track-hist').innerHTML = `<div class="panel" style="margin-top:14px"><h2>${flag(r.info?.country)} ${esc(r.track)} <span class="h-act">layout e record per configurazione</span></h2>
      <table><thead><tr><th>Layout</th><th class="right">Lunghezza</th><th class="right">Box</th><th class="right">Tuo miglior giro</th><th class="right">Record di sessione</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="muted" style="margin-top:6px">Il tuo miglior giro per layout dai file risultato (prova, qualifica e gara); * = dal record personale in carriera/prove (una sola configurazione mai corsa: il save non distingue i layout).</div></div>`;
    $('#track-hist').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* -------- setup / pressioni -------- */
async function drawSetup(m){
  const [b, card] = await Promise.all([api('garage', {}), api('card').catch(() => null)]);
  const carSel = card?.carName ? { carName: card.carName } : null;
  function fmtLapS(s){ if(s==null||!Number.isFinite(s)) return '—'; const m=Math.floor(s/60); const r=s-m*60; return m+':'+r.toFixed(1).padStart(4,'0'); }
  const tel = await api('garage', { action: 'sessions', car: carSel?.carName ?? null }).catch(() => ({ found: false, sessions: [], advice: {} }));
  const list = tel.sessions ?? [];
  const cur = list[0];
  const psi = (v) => (v == null ? '—' : Number(v).toFixed(1));
  const telHtml = list.length ? (() => {
    const s = cur;
    const adv = tel.advice ?? {};
    const race = tel.raceAdvice ?? {};
    // il consiglio gara è onesto solo se la telemetria è della pista del round corrente
    const normTrk = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
    const offTrack = race.ok && tel.basisTrack && tel.trackDisplay && normTrk(tel.basisTrack) !== normTrk(tel.trackDisplay) && !normTrk(tel.trackDisplay).startsWith(normTrk(tel.basisTrack)) && !normTrk(tel.basisTrack).startsWith(normTrk(tel.trackDisplay));
    const advHtml = race.ok && race.raceStartPsi != null
      ? `<div class="banner good" style="margin-top:8px"><b>🏁 PER LA GARA (${tel.raceLaps ?? '?'} giri): parti da <b>${race.raceStartPsi} PSI</b></b> — finestra ${race.raceRange?.[0]}–${race.raceRange?.[1]} PSI<br>
         <span class="muted">Qualifica / giri secchi: ${race.qualiStartPsi} PSI · Target a caldo ${tel.target} PSI<br>${esc(race.raceAdvice ?? '')}${offTrack ? `<br>⚠️ Consiglio basato sull'ultima uscita su <b>${esc(tel.basisTrack)}</b>, non su ${esc(tel.trackDisplay)}: fai qualche giro lì per metterlo a punto su questa pista` : ''}</span></div>
         <div class="banner info" style="margin-top:6px"><b>💡 Base telemetria</b> (uscite brevi): parti da <b>${adv.suggestedStartPsi} PSI</b> (finestra ${adv.range?.[0]}–${adv.range?.[1]})<br><span class="muted">${esc(adv.advice)}</span></div>`
      : (adv.ok
        ? `<div class="banner good" style="margin-top:8px"><b>💡 Pressione consigliata (${esc(tel.classLabel ?? '')}): parti da <b>${adv.suggestedStartPsi} PSI</b></b> (finestra ${adv.range?.[0]}–${adv.range?.[1]} PSI, target a caldo ${tel.target} PSI)<br><span class="muted">${esc(adv.advice)}</span></div>`
        : (adv.advice ? `<div class="banner info" style="margin-top:8px">${esc(adv.advice)}</div>` : ''));
    const logRows = (tel.log ?? []).map((e) => `<tr><td class="muted">${esc(String(e.at).replace('T',' ').slice(0,16))}</td><td>${esc(e.car)}</td><td>${esc(e.track)}</td><td class="right"><b>${e.suggestedStartPsi} PSI</b></td><td>${esc(e.basisKindLabel ?? '—')}</td></tr>`).join('');
    const telLaps = tel.telemetryLaps ?? 10;
    return `<div class="panel" style="margin-top:14px"><h2>Telemetria MoTeC — ${esc(tel.car ?? s.car ?? '')} <span class="muted" style="font-size:12px">target ${tel.target} PSI · ${list.length} sessioni recenti · scritta da EVO in Saved Games\\ACE\\MoTec</span></h2>
    <div class="muted" style="margin-bottom:6px;font-size:12px">📌 In EVO, opzione <b>telemetria</b> nel setup della gara: imposta <b>${telLaps} giri</b> per questa auto${telLaps >= 15 ? ' (è veloce: può registrare a lungo)' : telLaps <= 8 ? ' (è lenta: ogni giro genera molti dati, non serve di più)' : ''}. Ricorda: va riattivata a ogni gara, e vale solo se attivi prima di avviare la sessione.</div>
    ${advHtml}
    <table style="margin-top:8px"><thead><tr><th>Quando</th><th>Sessione</th><th class="right">Fredda LF/RF</th><th class="right">Calda LF/RF</th><th class="right">Best lap</th><th class="right">L/giro</th><th class="right">Bumpstop RF</th><th class="right">Δ int/ext RF</th><th>Preset</th><th>Meteo</th></tr></thead>
    <tbody>${list.map((r) => `<tr><td class="muted">${esc(r.when ?? '')}</td><td>${esc(r.kindLabel ?? 'n/d')}</td><td class="right"><b>${psi(r.cold?.LF)}</b> / ${psi(r.cold?.RF)}</td><td class="right">${psi(r.hot?.LF)} / ${psi(r.hot?.RF)}</td><td class="right">${fmtLapS(r.bestLapSec)}</td><td class="right">${r.fuelPerLap!=null?r.fuelPerLap+' L':'—'}</td><td class="right">${r.bump?.RF?.contactPct!=null?r.bump.RF.contactPct+'%':'—'}</td><td class="right">${r.camberProxy?.RF!=null?(r.camberProxy.RF>0?'+':'')+r.camberProxy.RF+'°':'—'}</td><td class="muted">${esc(r.preset ?? '—')}</td><td class="muted">${esc(r.weather ? r.weather.replace(/^.*_/,'') : '—')}</td></tr>`).join('')}</tbody></table>
    <details style="margin-top:10px"><summary class="muted">Ultima sessione — dettaglio per giro (pressioni e temperature)</summary>
    <table><thead><tr><th>Giro</th><th class="right">Durata</th><th class="right">Benzina usata</th><th class="right">PSI LF (fine)</th><th class="right">Temp gomma LF</th><th class="right">Max bordo RF</th></tr></thead>
    <tbody>${(s.laps ?? []).filter(l=>l.durationSec>15).map(l=>`<tr><td>${l.lap}</td><td class="right">${l.durationSec}s</td><td class="right">${l.fuelUsed!=null?l.fuelUsed+' L':'—'}</td><td class="right">${l.pressures?.LF!=null?Number(l.pressures.LF).toFixed(1):'—'}</td><td class="right">${l.tair?.LF!=null?Number(l.tair.LF).toFixed(0)+'°':'—'}</td><td class="right">${l.surf?.RF?l.surf.RF.map(v=>Number(v).toFixed(0)).join('/'):'—'}°</td></tr>`).join('')}</tbody></table>
    </details>
    <div class="muted" style="margin-top:6px">Bumpstop = % di tempo con la sospensione a fine corsa (alto → assetto troppo basso o molle troppo morbide) · Δ int/ext = differenza termica interno–esterno della gomma RF (effetto camber in pista) · condizioni ultima sessione: aria ${s.airTemp ?? '—'}° · pista ${s.roadTemp ?? '—'}°</div>
    ${logRows ? `<h3 style="margin-top:12px">Consigli già dati</h3><table><thead><tr><th>Quando</th><th>Auto</th><th>Pista</th><th class="right">Partenza consigliata</th><th>Base</th></tr></thead><tbody>${logRows}</tbody></table>` : ''}
    </div>`;
  })() : `<div class="panel" style="margin-top:14px"><h2>Telemetria MoTeC</h2><div class="muted">${esc(tel.hint ?? 'Nessuna sessione trovata per questa auto. Fai un giro: EVO scrive la telemetria da sola in Saved Games\\ACE\\MoTec.')}</div></div>`;
  const html = `
  <div class="panel">
    <h2>Regola dei 4 PSI <span class="h-act">pressioni target a caldo per classe auto</span></h2>
    <div class="muted" style="margin-bottom:10px">Fai 3–4 giri con la pressione di partenza scelta, poi leggi la pressione a calfo nell'HUD/MFD dei pneumatici. Inserisci i due valori: il tool calibra la partenza per arrivare sul target della classe.
    Target Kunos: ${b.classes.map(c=>`${esc(c.label)} <b>${c.target}</b>`).join(' · ')} PSI.</div>
    <form id="f-psi" class="row" style="align-items:end;flex-wrap:wrap;gap:10px">
      <label class="muted">Da freddo (PSI)<br><input type="number" id="i-cold" step="0.1" min="10" max="45" required style="width:110px"></label>
      <label class="muted">A caldo (PSI)<br><input type="number" id="i-hot" step="0.1" min="10" max="50" required style="width:110px"></label>
      <label class="muted">Classe auto<br><select id="i-target" style="width:200px">${b.classes.map(c=>`<option value="${c.target}" ${c.id==='slicks'?'selected':''}>${esc(c.label)} — ${c.target} PSI</option>`).join('')}</select></label>
      <button class="act" type="submit">Calibra</button>
    </form>
    <div id="psi-result" style="margin-top:10px"></div>
  </div>
  <div class="panel" style="margin-top:14px">
    <h2>Auto della serie — ${esc(b.trackDisplay ?? 'pista n/d')} <span class="muted" style="font-size:12px">note salvate per auto+pista</span></h2>
    <table><thead><tr><th>Auto</th><th>Classe</th><th class="right">Target caldo</th><th>Nota di setup</th></tr></thead>
    <tbody>${b.rows.map(r=>`<tr>
      <td><b>${esc(r.carName)}</b></td><td class="muted">${esc(r.classLabel)}</td><td class="right"><b>${r.target}</b> PSI</td>
      <td>${r.note ? `<span class="muted">${esc(r.note)}</span> <button class="mini" data-carnote="${esc(r.car)}">modifica</button>` : `<button class="mini" data-carnote="${esc(r.car)}">+ nota</button>`}</td>
    </tr>`).join('')}</tbody></table>
  </div>`;
  m.innerHTML = html + telHtml;
  $('#f-psi').onsubmit = (ev) => {
    ev.preventDefault();
    const r = window.__lastPsi = null;
    api('garage', { action: 'psi', cold: Number($('#i-cold').value), hot: Number($('#i-hot').value), target: Number($('#i-target').value) })
      .then(p => {
        $('#psi-result').innerHTML = p.ok
          ? `<div class="banner ${Math.abs(p.hot-p.target)<0.15?'good':'info'}"><b>${esc(p.advice)}</b></div>`
          : `<div class="banner bad">${esc(p.error)}</div>`;
      })
      .catch(e => { $('#psi-result').innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; });
  };
  $$('button[data-carnote]').forEach(btn => btn.onclick = async () => {
    const car = btn.dataset.carnote;
    const row = b.rows.find(r => r.car === car);
    const text = prompt(`Nota di setup per ${row.carName} su ${b.trackDisplay ?? 'questa pista'}:`, row.note ?? '');
    if (text === null) return;
    await api('garage', { action: 'note', car, track: b.track, text });
    toast(text ? 'Nota salvata.' : 'Nota rimossa.', 'ok'); render();
  });

  // diagnostica telemetria: stato dei file .ld scritti da EVO, per auto
  const diag = await api('telem-diagnostics').catch(() => ({ cars: [] }));
  const fmtKB = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  const diagRows = (diag.cars ?? []).map((c) => {
    const files = (c.files ?? []).map((f) => `<tr>
      <td class="muted">${esc(f.whenLocal ?? '')}</td><td>${esc(f.track)}</td>
      <td class="right">${fmtKB(f.size)}</td>
      <td>${f.valid ? '<span class="tag green" style="font-size:10px;padding:1px 6px">dati ok</span>' : '<span class="tag" style="font-size:10px;padding:1px 6px;background:#3a1d1d;color:#ff9b9b">VUOTO</span>'}</td>
      <td class="right muted">${f.withData}/${f.channels} canali</td>

    const emptyN = (c.files ?? []).filter((f) => !f.valid).length;
    const health = emptyN === 0
      ? '<span class="tag green" style="font-size:10px;padding:1px 6px">OK</span>'
      : `<span class="tag" style="font-size:10px;padding:1px 6px;background:#3a1d1d;color:#ff9b9b">${emptyN} vuoti</span>`;
    return `<details style="margin-top:6px" ${c.files.some(f=>!f.valid)?'open':''}><summary style="cursor:pointer;font-size:12.5px"><b>${esc(c.car)}</b> ${health} <span class="muted" style="font-size:11px">· ${c.total} file totali · ultimi ${c.files.length} elencati</span></summary>
      <table style="margin-top:6px"><thead><tr><th>Quando</th><th>Pista</th><th class="right">Dimensione</th><th>Stato</th><th class="right">Canali con dati</th></tr></thead><tbody>${files}</tbody></table>
    </details>`;
  }).join('');
  const anyEmpty = (diag.cars ?? []).some((c) => (c.files ?? []).some((f) => !f.valid));
  const diagHtml = (diag.cars ?? []).length ? `<div class="panel" style="margin-top:14px" id="telem-diag">
    <h2>Diagnostica telemetria <span class="h-act">i file .ld che EVO scrive in Saved Games\\ACE\\MoTec</span></h2>
    ${anyEmpty ? `<div class="banner warn" style="margin-bottom:8px">Ci sono file <b>vuoti</b> (solo intestazione, 0 canali con dati): è il bug di EVO che non scarica i dati nel file. I consigli del BOX su quelle auto usano la stima finché una sessione non scrive dati veri.</div>` : `<div class="banner good" style="margin-bottom:8px">Tutti gli ultimi file hanno dati: la telemetria sta funzionando.</div>`}
    ${diagRows}
    <div class="muted" style="margin-top:8px">Un file valido pesa 2–11 MB e ha 62 canali con dati; uno vuoto pesa ~19 KB (solo intestazione). Aggiorna la pagina per risentonare dopo una sessione.</div>
  </div>` : `<div class="panel" style="margin-top:14px"><h2>Diagnostica telemetria</h2><div class="muted">Nessun file MoTeC trovato in ${esc(diag.root ?? 'Saved Games\\ACE\\MoTec')}: fai una sessione e EVO scriverà il primo file.</div></div>`;
  m.innerHTML += diagHtml;

  // salute sistema + registro errori: diagnostica degli strumenti, non della carriera
  const [health, warns] = await Promise.all([
    api('system-health').catch(() => null),
    api('warnings').catch(() => ({ total: 0, modules: [] })),
  ]);
  let healthHtml = `<div class="panel" style="margin-top:14px" id="system-health"><h2>Salute sistema <span class="h-act">lettore live e telemetria</span></h2>`;
  if (health) {
    const rd = health.reader ?? {};
    const liveRow = (label, ok, note) => `<div style="padding:3px 0;border-bottom:1px solid var(--line,#222)"><b>${label}:</b> ${ok ? '<span class="tag green" style="font-size:10px;padding:1px 6px">ok</span>' : '<span class="tag" style="font-size:10px;padding:1px 6px;background:#3a1d1d;color:#ff9b9b">no</span>'}${note ? ` <span class="muted" style="font-size:11px">${note}</span>` : ''}</div>`;
    healthHtml += liveRow('Processo PowerShell', rd.running, rd.ps1Exists ? (rd.alive ? 'vivo e aggiorna' : (rd.running ? 'avviato ma silenzioso' : 'non ancora partito (si avvia al primo accesso al LIVE)')) : 'script tools/acevo-live.ps1 mancante');
    healthHtml += liveRow('Gioco in sessione', health.game, health.gameVersion ? `versione gioco ${esc(health.gameVersion)}` : '');
    if (health.smVersion) healthHtml += `<div style="padding:3px 0"><b>Shared memory:</b> <span class="muted" style="font-size:11px">interfaccia ${esc(health.smVersion)}${health.gameVersion ? ' · gioco ' + esc(health.gameVersion) : ''}${rd.restarts ? ` · ${rd.restarts} ricicli del lettore` : ''}</span></div>`;
    if (health.stderrTail) healthHtml += `<div class="muted" style="font-size:11px;margin-top:4px">PowerShell stderr: ${esc(health.stderrTail)}</div>`;
    const ld = health.telem?.lastLd;
    if (ld) {
      healthHtml += `<div style="padding:3px 0;border-bottom:1px solid var(--line,#222)"><b>Ultimo file .ld:</b> ${ld.valid ? '<span class="tag green" style="font-size:10px;padding:1px 6px">dati ok</span>' : '<span class="tag" style="font-size:10px;padding:1px 6px;background:#3a1d1d;color:#ff9b9b">VUOTO</span>'} <span class="muted" style="font-size:11px">${esc(ld.car)} · ${esc(ld.file)} · ${Math.round(ld.size/1024)} KB · ${esc(ld.when)} · ${ld.withData}/${ld.channels} canali</span></div>`;
      if (!ld.valid) healthHtml += `<div class="banner warn" style="margin-top:6px">L'ultimo file scritto da EVO è vuoto (solo intestazione): è il bug del gioco, non del tool. I consigli del BOX usano la stima finché EVO non riscrive dati veri.</div>`;
    } else {
      healthHtml += `<div class="muted" style="font-size:11px">Nessun file .ld trovato in ${(health.telem?.dirsChecked ?? []).map((d) => esc(d)).join(', ')}.</div>`;
    }
  } else {
    healthHtml += '<div class="muted">Endpoint system-health non disponibile: riavvia il server del tool.</div>';
  }
  healthHtml += '</div>';

  let warnsHtml = `<div class="panel" style="margin-top:14px" id="warnings-panel"><h2>Registro errori <span class="h-act">ultimi problemi degli strumenti (data/errors.jsonl)</span></h2>`;
  const mods = warns.modules ?? [];
  if (!mods.length) {
    warnsHtml += '<div class="banner good">Nessun errore registrato: gli strumenti lavorano puliti.</div>';
  } else {
    warnsHtml += mods.map((md) => `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12.5px"><b>${esc(md.module)}</b> <span class="tag" style="font-size:10px;padding:1px 6px;background:#3a2a1d;color:#ffc78a">${md.count}</span> <span class="muted" style="font-size:11px">ultimo: ${esc(String(md.last[0]?.at ?? '').slice(0,19).replace('T',' '))}</span></summary><div style="margin-top:4px">${md.last.map((w) => `<div style="padding:2px 0;border-bottom:1px solid var(--line,#222);font-size:12px"><span class="muted">${esc(String(w.at).slice(11,19))}</span> ${esc(w.message)}${w.extra?` <span class="muted">(${esc(w.extra)})</span>`:''}</div>`).join('')}</div></details>`).join('');
  }
  warnsHtml += '</div>';
  m.innerHTML += healthHtml + warnsHtml;
}

/* -------- difficoltà -------- */
async function drawDifficulty(m){
  const v = await api('difficulty');
  const rng = v.trimRange ?? {min:-20, max:20};
  const sr = v.sliderRange ?? {min:0, max:120};
  m.innerHTML = `
  <div class="panel">
    <h2>Difficoltà AI <span class="h-act">modalità ${esc(v.mode)}</span></h2>
    <div class="banner info" style="margin:0 0 12px">Lo slider AI di Assetto Corsa EVO va da <b>${sr.min}</b> a <b>${sr.max}%</b> e si imposta direttamente nel gioco. La difficoltà interna del tool (scala 70–120) viene convertita in quel range; la modalità adattiva aggiunge un <b>trim da ${rng.min} a ${rng.max > 0 ? '+' : ''}${rng.max}</b> in base ai risultati. Con i cursori qui sotto regoli il trim di ogni serie a mano.</div>
    <div class="row" style="margin-bottom:12px">
      <button class="mini ${v.mode==='adaptive'?'on':''}" data-mode="adaptive">adattiva</button>
      <button class="mini ${v.mode==='fixed'?'on':''}" data-mode="fixed">fissa</button>
      <input type="number" id="i-diffval" min="70" max="120" value="95" style="width:90px" title="valore fisso (70–120)">
    </div>
    ${v.pending ? `<div class="banner ${v.pending.to>=(v.trimRange?.max??20)?'warn':''}">Suggerimento in attesa — ${esc(v.pendingDisplay)}: ${esc(v.pending.reason)} → trim ${v.pending.to >= 0 ? '+' : ''}${v.pending.to}${v.pending.to>=(v.trimRange?.max??20)?' (massimo raggiunto)':''}
      <button class="mini" id="b-acc">accetta</button> <button class="mini" id="b-rej">rifiuta</button></div>` : ''}
    <div style="margin-top:10px">
    ${v.rows.map(r=>{
      const atMax = r.trim >= (v.trimRange?.max ?? 20);
      return `<div class="diff-row" data-id="${esc(r.id)}">
      <span>${r.current?'◄':''}</span><span class="nm">${esc(r.display)}${r.locked?' 🔒':''}</span>
      <span class="num" title="base della serie + trim">base ${r.base}</span><span class="num" title="trim adattivo (±${rng.max})">trim ${r.trim>=0?'+':''}${r.trim}${atMax?' ⚠️':''}</span>
      <span class="num" title="correzione classe / pista">${r.offClass>=0?'+':''}${r.offClass}/${r.offTrack>=0?'+':''}${r.offTrack}</span>
      <span class="sl" title="centro consigliato convertito in slider EVO">${r.slider}%</span>
      <span class="rangebox">
        <input type="number" class="rmin" min="0" max="100" step="1" value="${r.rangeMin}" title="minimo da impostare in EVO (consiglio: ${Math.max(0,r.slider-5)})" ${r.locked?'disabled':''}>
        <span class="dash">–</span>
        <input type="number" class="rmax" min="0" max="100" step="1" value="${r.rangeMax}" title="massimo da impostare in EVO (consiglio: ${Math.min(100,r.slider+5)})" ${r.locked?'disabled':''}>
        <b class="pct">%</b>
        <button class="mini rc" title="torna al default della serie: 88–93%" ${r.overridden?'':'style="visibility:hidden"'}>↺</button>
      </span>
    </div>`;}).join('')}
    </div>
    <div class="muted" style="margin-top:10px">⚠️ = trim al massimo (${rng.max}): oltre si va solo cambiando serie. Nelle caselle scrivi l'intervallo <b>min–max esatto da impostare in EVO</b> (${sr.min}–${sr.max}), come nel gioco: si salva da solo; ↺ torna al consiglio (centro ±5). Il consiglio si ferma a 100: se una serie resta facile anche a fondo scala, si cambia serie.</div>
  </div>`;
  $$('button[data-mode]').forEach(b => b.onclick = async () => {
    try { await api('difficulty-action', {op:'mode', mode:b.dataset.mode, value:Number($('#i-diffval').value)}); render(); } catch(e){ toast(e.message,'err'); }
  });
  $('#b-acc')?.addEventListener('click', async () => { await api('difficulty-action', {op:'accept'}); render(); });
  $('#b-rej')?.addEventListener('click', async () => { await api('difficulty-action', {op:'reject'}); render(); });
  // intervallo min-max di ogni serie, come nel gioco: si salva appena cambi una delle due caselle
  const saveRange = async (row) => {
    const min = Number($('.rmin', row).value), max = Number($('.rmax', row).value);
    try {
      await api('difficulty-action', {op:'range', nodeId: row.dataset.id, min, max});
      toast(`Intervallo di ${row.querySelector('.nm').textContent.trim()}: ${Math.min(min,max)}–${Math.max(min,max)}%`, 'ok');
    } catch(e){ toast(e.message, 'err'); }
  };
  $$('.diff-row', m).forEach(row => {
    $('.rmin', row)?.addEventListener('change', () => saveRange(row));
    $('.rmax', row)?.addEventListener('change', () => saveRange(row));
    $('.rc', row)?.addEventListener('click', async () => {
      try { await api('difficulty-action', {op:'range', nodeId: row.dataset.id, clear:true}); toast('Tornato il consiglio automatico.', 'ok'); }
      catch(e){ toast(e.message, 'err'); }
    });
  });
}

function signOffer(index, name){

/* -------- fine stagione (da cruscotto) -------- */
async function seasonEndFlow(force){
  try {
    const r = await api('season-end', {force});
    await refreshBoot();
    const offersHtml = r.offers.length ? r.offers.map(o=>`<div class="offer"><span class="n">${o.index}) ${esc(o.display)}</span>
      <span class="muted">L${o.level} · ${esc(o.discipline)} · ${esc(o.note)} · ${o.access==='closed'?'parco chiuso (solo contratto)':`affitto ${money(o.rent)} €`}</span>

      : '<div class="empty">Nessuna offerta disponibile.</div>';
    modal(`Stagione ${r.me.season ?? ''} chiusa`, `
      <div class="winline ${r.champion?'gold':''}">${r.champion ? '🏆 CAMPIONE!' : 'Posizione finale: P'+r.me.position}</div>
      <div style="text-align:center" class="muted">${r.me.points} punti${r.bonus ? ' · bonus titolo '+money(r.bonus)+' €' : ''}</div>
      ${r.memoryAssigned ? `<div class="banner warn" style="margin-top:12px">📜 <b>Eredità di famiglia:</b> ${esc(r.memoryAssigned.ancestor)}, tuo ${esc(r.memoryAssigned.relation)} (${esc(r.memoryAssigned.era)}), ti affida l'impresa «${esc(r.memoryAssigned.objective)}» in ${esc(r.memoryAssigned.series)}${r.memoryAssigned.carName ? ` con la sua ${esc(r.memoryAssigned.carName)}` : ''}. Eredità in palio: <b>${money(r.memoryAssigned.inherit)} €</b>.</div>` : ''}
      <h2 style="margin:18px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim)">Offerte per la prossima stagione</h2>
      ${offersHtml}`,
      [['Deciderò dopo','ghost',()=>{ render(); }]]);
    $$('button[data-acc]').forEach(b => b.onclick = async () => {
      try { const rr = await api('accept', {index:Number(b.dataset.acc)}); $('#modal-root').innerHTML=''; toast('Contratto firmato: '+rr.signed, 'ok'); await refreshBoot(); render(); }
      catch(e){ toast(e.message,'err'); }
    });
  } catch(e){
    if (e.data?.code === 'SEASON_INCOMPLETE') {
      modal('Stagione incompleta', `<p>${esc(e.message)}</p><p class="muted" style="margin-top:8px">Puoi chiuderla comunque: le gare mancanti restano senza punti.</p>`,
        [['Annulla','ghost',()=>{}], ['Chiudi comunque','ghost danger', () => { seasonEndFlow(true); }]]);
      return;
    }
    toast(e.message, 'err');
  }
}

    <div class="grid2">
      <div><div class="muted" style="margin-bottom:6px">😨 Nemesi — ti battono più spesso di quanto li batti</div>
        ${d.nemesi.length ? d.nemesi.slice(0,4).map(r=>`<div class="rivalrow"><b>${esc(r.name)}</b>${r.nemesis?'<span class="tag red">nemesi</span>':''}<span class="muted">${esc(r.team ?? '')}</span>${h2hBadge(r.h2h.beats, r.h2h.losses)}</div>`).join('') : '<div class="muted">Nessuno ancora: continua così.</div>'}
      </div>
      <div><div class="muted" style="margin-bottom:6px">😎 Vittime preferite — non ti battono mai</div>
        ${d.vittime.length ? d.vittime.slice(0,4).map(r=>`<div class="rivalrow"><b>${esc(r.name)}</b><span class="muted">${esc(r.team ?? '')}</span>${h2hBadge(r.h2h.beats, r.h2h.losses)}</div>`).join('') : '<div class="muted">Le costruirai strada facendo.</div>'}
      </div>
    </div>`}
  </div>
  ${rows.length ? `<div class="panel"><h2>Tutti i rivali <span class="h-act">clicca una riga per la scheda completa</span></h2>
    <table><thead><tr><th>Rivale</th><th>Squadra</th><th class="right">Gare insieme</th><th class="right">Tu–Lui</th><th>Momentum</th><th>Forma (ultime 5)</th><th class="right">Vittorie</th><th class="right">Podi</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="rival-link" data-key="${esc(r.key)}" style="cursor:pointer">
      <td><b>${esc(r.name)}</b>${r.nemesis?' <span class="tag red">nemesi</span>':''}${r.lastSeen?`<div class="faint" style="font-size:11px">visto: ${esc(r.lastSeen.node)} R${r.lastSeen.round}</div>`:''}</td>
      <td class="muted">${esc(r.team ?? '—')}</td>
      <td class="right">${r.sharedRaces}</td>
      <td class="right">${h2hBadge(r.h2h.beats, r.h2h.losses)}</td>
      <td>${r.trend==null?'—':r.trend>0?`<span class="tag green">▲ +${r.trend}</span>`:r.trend<0?`<span class="tag bad">▼ ${r.trend}</span>`:'<span class="faint">stabile</span>'}</td>
      <td>${r.form.map(f=>`<span class="chip ${f==='DNF'?'':Number(f)<=3?'gold':''}" style="font-size:10px;padding:1px 6px">${f}</span>`).join(' ')}</td>
      <td class="right">${r.wins}</td>
      <td class="right">${r.podiums}</td>
    </tr>`).join('')}</tbody></table>
  </div>` : ''}`;
  $$('.rival-link', m).forEach((tr)=>tr.onclick=()=>showRival(tr.dataset.key));
}

async function showRival(key){
  try {
    const d = await api('rival-detail', {key});
    if (d.error) return toast(d.error, 'err');
    const net = d.h2h.losses - d.h2h.beats;
    modal(`Scheda rivale — ${d.name}`, `
      <div class="grid4" style="margin-bottom:14px">
        <div class="kpi"><div class="l">Scontri</div><div class="v">${d.totals.races}</div></div>
        <div class="kpi"><div class="l">Tu-Lui</div><div class="v ${net>0?'good':net<0?'bad':''}">${d.h2h.losses}–${d.h2h.beats}</div></div>
        <div class="kpi"><div class="l">Vittorie</div><div class="v">${d.totals.wins}</div></div>
        <div class="kpi"><div class="l">Suo best</div><div class="v">${d.bestPos!=null?'P'+d.bestPos:'—'}</div></div>
      </div>
      <div class="muted" style="margin-bottom:10px">${esc(d.team ?? 'senza squadra')}${d.nation?' · '+esc(d.nation):''}${d.car?' · auto: '+esc(d.car):''}${d.since?' · in registro dal '+esc(d.since):''}</div>
      ${d.winsDetail.length ? `<div style="margin-bottom:10px"><b>Ha vinto a:</b> ${d.winsDetail.map(w=>`${esc(w.track)} <span class="muted">S${w.season} R${w.round+1}</span>`).join(' · ')}</div>` : ''}
      ${d.beatsMeAt.length ? `<div class="banner warn" style="margin-bottom:10px">Ti ha battuto a: <b>${d.beatsMeAt.map(esc).join(', ')}</b></div>` : ''}
      <div style="max-height:260px;overflow:auto"><table><thead><tr><th>Gara</th><th class="right">Lui</th><th class="right">Tu</th><th>Suo giro</th><th>Esito</th></tr></thead><tbody>
        ${d.meetings.map(m=>`<tr><td>${esc(m.track)} <span class="faint">S${m.season} R${m.round+1}</span></td><td class="right">${m.dnf?'rit.':m.pos!=null?'P'+m.pos:'—'}</td><td class="right">${m.mePos!=null?'P'+m.mePos:'—'}</td><td class="muted">${esc(m.bestLap??'—')}</td><td>${m.beatMe?'<span class="tag bad">battuto</span>':'<span class="tag good">vinto</span>'}</td></tr>`).join('')}
      </tbody></table></div>`,
      [['Chiudi','ghost',()=>{}]]);
  } catch(e){ toast(e.message, 'err'); }
}

/* ============================== avvio ============================== */
/* auto-aggiornamento: quando il watcher importa un risultato (o la pagina resta
   in background e i dati cambiano), il cruscotto si ricarica da solo */
let _watchSeq = null;
setInterval(async () => {
  try {
    const w = await api('watcher');
    const seq = w.seq ?? 0;
    if (_watchSeq === null) { _watchSeq = seq; return; }
    if (seq !== _watchSeq) {
      _watchSeq = seq;
      if (w.lastMsg?.msg) toast(w.lastMsg.msg, w.lastMsg.kind === 'good' ? 'ok' : '');
      await refreshBoot();
      render();
    }
  } catch {}
}, 5000);

/* widget live nel cruscotto (dati di gara in tempo reale) */
async function drawLiveStrip(){
  const host = document.querySelector('#live-strip');
  if (!host) return;
  try {
    const [r, w, h] = await Promise.all([api('live'), api('watcher'), api('system-health').catch(() => null)]);
    drawMotecStrip(h);
    if (w?.lastMsg?.msg){ host.title = w.lastMsg.msg; }
    if (!r.game){ host.innerHTML = '<span class="dot"></span> EVO chiuso'; host.className = 'chip'; return; }
    const p = r.player;
    if (!p || !r.live){ host.className = 'chip'; host.innerHTML = `<span class="dot on"></span> EVO aperto · ${esc(r.session?.type ?? '')}`; return; }
    host.className = 'chip gold';
    const rec = w?.armed ? ' · ⏺ registrazione' : '';
    host.innerHTML = `<span class="dot on"></span> ${p.position ? 'P'+p.position+'/'+p.drivers : 'in pista'}${p.lapsTotal?` · giro ${p.lapNo ?? p.lapsDone+1}/${p.lapsTotal}`:''}${p.gapAhead?` · +${p.gapAhead.toFixed(1)}s`:''}${p.bestLap?` · best ${p.bestLap}`:''}${rec}`;
  } catch { host.className = 'chip'; }
}
setInterval(drawLiveStrip, 2000);

/* icona MoTeC nell'header: dice se EVO sta scrivendo telemetria adesso.
   ⏺ rosso lampeggiante = registrazione in corso (file .ld aggiornato da <10s);
   verde = l'ultimo file ha dati; rosso fisso = file vuoto (bug EVO);
   nascosto = nessun file .ld ancora scritto. */
function drawMotecStrip(h){
  const host = document.querySelector('#motec-strip');
  if (!host) return;
  const ld = h?.telem?.lastLd;
  if (!ld){
    const anyDir = (h?.telem?.dirsState ?? []).some((d) => d.exists);
    host.className = 'chip';
    host.innerHTML = '<span class="dot"></span> attesa EVO';
    host.title = 'Nessun file .ld ancora: appena termini una sessione, EVO scrive la telemetria e l\'indicatore si accende. Ricorda: in EVO attiva la registrazione telemetria in Setup → Elettronica (e imposta i giri per la sessione) PRIMA di avviare la sessione.';
    if (!anyDir) host.className = 'chip hidden';
    return;
  }
  const age = Date.now() - (ld.mtimeMs ?? 0);
  if (ld.valid && age < 10000){
    host.className = 'chip gold';
    host.innerHTML = '<span class="dot rec"></span> ⏺ registra';
    host.title = 'MoTeC sta registrando: ' + ld.car + (ld.track ? ' · ' + ld.track : '') + ' · aggiornato ' + ld.when + '. Ricorda: in EVO la registrazione va attivata in Setup → Elettronica e i giri impostati PRIMA di avviare la sessione.';
  } else if (ld.valid){
    host.className = 'chip green';
    host.innerHTML = '<span class="dot on"></span> dati ok';
    host.title = 'Ultimo file MoTeC con dati: ' + ld.car + (ld.track ? ' · ' + ld.track : '') + ' · ' + ld.when + '. Ricorda: in EVO attiva la registrazione telemetria in Setup → Elettronica (e imposta i giri) PRIMA di avviare la sessione.';
  } else if (age < 10000){
    host.className = 'chip red';
    host.innerHTML = '<span class="dot rec"></span> scrive vuoto!';
    host.title = 'EVO sta scrivendo telemetria ADESSO ma il file non ha dati (bug del gioco, non del tool): ' + ld.car + (ld.track ? ' · ' + ld.track : '') + '. I consigli del BOX useranno la stima. Ricorda: in EVO la registrazione va attivata in Setup → Elettronica e i giri impostati PRIMA di avviare la sessione.';
  } else {
    host.className = 'chip red';
    host.innerHTML = '<span class="dot"></span> file vuoto';
    host.title = 'L\'ultimo file .ld di EVO non ha dati (bug del gioco, non del tool): ' + ld.when + '. I consigli del BOX usano la stima. Ricorda: in EVO la registrazione va attivata in Setup → Elettronica e i giri impostati PRIMA di avviare la sessione.';
  }
}

refreshBoot().then(render).catch(e => {
  $('#main').innerHTML = `<div class="panel"><div class="banner bad">Il server non risponde: ${esc(e.message)}<br><span class="muted">Rilancia apri-gui.cmd</span></div></div>`;
});
setInterval(async () => {
  try {
    const b = await api('boot');
    $('#dot-evo').classList.toggle('on', !!b.gameRunning);
    $('#t-evo').textContent = b.gameRunning ? 'EVO aperto' : 'chiuso';
  } catch {}
}, 30000);
</script>
