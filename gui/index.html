<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carriera EVO — Team Manager</title>
<style>
:root{
  --bg:#0a0d12; --bg2:#0e1118; --panel:#11161f; --panel2:#161c27; --panel3:#1b2230;
  --line:#232b3a; --line2:#2c3546;
  --text:#e7ebf2; --dim:#8a95a7; --faint:#5d6879;
  --acc:#d9a83e; --acc-dim:#8a6b28; --acc2:#4d9fdb;
  --good:#4cc27a; --bad:#e05d5d; --warn:#e8a23a; --red:#c23b3b;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{background:var(--bg); color:var(--text); font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif}
a{color:var(--acc2); text-decoration:none}
::selection{background:#d9a83e40}

/* ============ struttura ============ */
#side{position:fixed; inset:0 auto 0 0; width:216px; background:var(--bg2); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:20}
#shell{margin-left:216px; min-height:100vh; display:flex; flex-direction:column}
main{flex:1; width:100%; max-width:1120px; margin:0 auto; padding:20px 24px 90px}
@media(max-width:920px){
  #side{position:static; width:auto; flex-direction:row; align-items:center; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line)}
  #side .side-foot{display:none}
  #shell{margin-left:0}
  main{padding:16px}
  nav#nav{flex-direction:row; padding:6px}
}

/* ============ sidebar ============ */
.brand{display:flex; align-items:center; gap:10px; padding:16px 18px 14px; border-bottom:1px solid var(--line)}
.stripes{width:26px; height:18px; flex:none}
.brand .t{line-height:1.15}
.brand .t b{display:block; font-size:14px; letter-spacing:.6px}
.brand .t span{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1.6px}
nav#nav{display:flex; flex-direction:column; gap:1px; padding:10px 8px; flex:1}
nav#nav button{display:flex; align-items:center; gap:10px; background:none; border:0; border-left:2px solid transparent; color:var(--dim); font:inherit; font-size:13.5px; padding:9px 12px; cursor:pointer; text-align:left; border-radius:0 8px 8px 0}
nav#nav button svg{width:16px; height:16px; flex:none; opacity:.75}
nav#nav button .nico{display:inline-flex}
nav#nav button .nico svg{opacity:.95}
nav#nav button:hover{color:var(--text); background:var(--panel2)}
nav#nav button.on{color:var(--acc); background:var(--panel2); border-left-color:var(--acc); font-weight:600}
nav#nav button.on svg{opacity:1}
nav#nav .badge{margin-left:auto; background:var(--acc); color:#141414; font-size:10.5px; font-weight:700; border-radius:99px; padding:0 7px; line-height:17px}
.side-foot{padding:12px 18px; border-top:1px solid var(--line); font-size:11px; color:var(--faint)}

/* ============ header ============ */
header#top{position:sticky; top:0; z-index:15; background:linear-gradient(180deg,#10141c 0%,#0d1118 100%); border-bottom:1px solid var(--line)}
header#top .in{max-width:1120px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.idblock{display:flex; align-items:center; gap:12px; min-width:0}
.avatar{width:38px; height:38px; border-radius:9px; background:linear-gradient(135deg,var(--acc) 0%,#9a6f22 100%); color:#141414; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; flex:none}
.idblock .nm{font-weight:700; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
.idblock .sub{font-size:11.5px; color:var(--dim); white-space:nowrap}
.hstats{margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.hstat{display:flex; flex-direction:column; align-items:flex-end; padding:0 14px; border-right:1px solid var(--line)}
.hstat:last-child{border-right:0}
.hstat .l{font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:1px}
.hstat .v{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.hstat .v.money{color:var(--good)} .hstat .v.rep{color:var(--acc2)}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--faint); margin-right:6px; vertical-align:1px}
.dot.on{background:var(--good); box-shadow:0 0 6px #4cc27a88}
.chip{display:inline-flex; align-items:center; padding:3px 10px; border:1px solid var(--line2); border-radius:99px; font-size:11.5px; color:var(--dim); white-space:nowrap}
.chip.gold{color:var(--acc); border-color:#d9a83e55}
.chip.green{color:var(--good); border-color:#4cc27a55}
.chip.red{color:var(--bad); border-color:#e05d5d55}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.25}}
.dot.rec{background:var(--bad); box-shadow:0 0 7px #e05d5daa; animation:recblink 1.1s infinite}

/* ============ pannelli ============ */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-top:16px}
.panel.acc{border-color:#d9a83e66}
.panel h2{font-size:11.5px; text-transform:uppercase; letter-spacing:1.4px; color:var(--dim); margin-bottom:14px; font-weight:700; display:flex; align-items:center; gap:10px}
.panel h2 .h-act{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:400; font-size:12.5px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media(max-width:860px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

.kpi{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.kpi .l{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:1px}
.kpi .v{font-size:22px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px; color:var(--dim); font-weight:500}
.kpi .v.good{color:var(--good)} .kpi .v.acc{color:var(--acc)} .kpi .v.acc2{color:var(--acc2)}
.kpi .kpi-top{display:flex; align-items:center; gap:7px; margin-bottom:2px}
.kpi .kico{width:22px; height:22px; border-radius:6px; background:var(--panel3); color:var(--acc); display:flex; align-items:center; justify-content:center; flex:none}
.kpi .kico svg{width:13px; height:13px}
.kpi .kico.blue{color:var(--acc2)} .kpi .kico.green{color:var(--good)}

/* ============ cruscotto ricco ============ */
.panel.hero{background:linear-gradient(135deg,#151b26 0%,#12151d 55%,#1a1509 100%); border-color:#d9a83e3d; position:relative; overflow:hidden}
.panel.hero .flagart{position:absolute; right:-16px; top:-20px; width:150px; height:150px; color:var(--acc); opacity:.08; pointer-events:none}
.panel h2 svg{width:14px; height:14px; flex:none; opacity:.9; color:var(--acc)}
.seasonprog{margin:2px 0 14px}
.sp-bar{height:6px; background:var(--panel3); border-radius:99px; overflow:hidden}
.sp-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--acc-dim),var(--acc)); border-radius:99px; transition:width .3s}
.sp-meta{display:flex; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--dim); margin-top:5px; flex-wrap:wrap}
.formchips{display:flex; gap:6px; align-items:center; margin-top:12px; flex-wrap:wrap}
.qtile{display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; color:var(--text); font:inherit; text-align:left; transition:border-color .15s}
.qtile:hover{border-color:var(--acc)}
.qtile svg{width:20px; height:20px; flex:none; color:var(--acc)}
.qtile b{display:block; font-size:13.5px}
.qtile small{display:block; color:var(--dim); font-size:11.5px; font-weight:400; margin-top:1px}
.liferow{display:flex; gap:12px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line)}
.liferow:last-child{border-bottom:0}
.lico{width:30px; height:30px; border-radius:9px; background:var(--panel3); color:var(--acc); display:flex; align-items:center; justify-content:center; flex:none}
.lico svg{width:15px; height:15px}
.lico.blue{color:var(--acc2)} .lico.green{color:var(--good)} .lico.red{color:var(--bad)}
.liferow .lt{font-size:13px; min-width:0}

table{width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums}
th{color:var(--faint); font-weight:600; text-align:left; padding:7px 9px; border-bottom:1px solid var(--line2); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; white-space:nowrap}
td{padding:8px 9px; border-bottom:1px solid #1d2430; vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#ffffff06}
tr.me td{background:#d9a83e14; font-weight:600}
tr.cur td{background:#4d9fdb10}
.right{text-align:right}
.muted{color:var(--dim); font-size:12.5px}
.faint{color:var(--faint)}

.tag{display:inline-block; font-size:10.5px; padding:1px 8px; border-radius:99px; border:1px solid var(--line2); color:var(--dim); letter-spacing:.4px; white-space:nowrap}
.tag.gold{color:var(--acc); border-color:#d9a83e55}
.tag.blue{color:var(--acc2); border-color:#4d9fdb55}
.tag.green{color:var(--good); border-color:#4cc27a55}
.tag.good{color:var(--good); border-color:#4cc27a55}
.tag.bad{color:var(--bad); border-color:#e0666655}

.rivalrow{display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line)}
.rivalrow b{min-width:160px}
.rivalrow .muted{flex:1}
.tag.red{color:var(--bad); border-color:#e05d5d55}

/* ============ pulsanti ============ */
button.act{background:var(--acc); color:#161207; border:0; font:inherit; font-weight:700; padding:10px 20px; border-radius:9px; cursor:pointer; letter-spacing:.2px}
button.act:hover{filter:brightness(1.12)}
button.act:disabled{opacity:.45; cursor:default}
button.red{background:var(--red); color:#fff}
button.ghost{background:transparent; color:var(--text); border:1px solid var(--line2); font:inherit; font-weight:500; padding:9px 16px; border-radius:9px; cursor:pointer}
button.ghost:hover{border-color:var(--acc); color:var(--acc)}
button.ghost.danger{color:var(--bad)}
button.ghost.danger:hover{border-color:var(--bad)}
button.mini{background:var(--panel3); color:var(--text); border:1px solid var(--line2); font-size:12px; font-weight:500; padding:5px 11px; border-radius:7px; cursor:pointer}
button.mini:hover{border-color:var(--acc); color:var(--acc)}
button.mini.on{background:var(--acc); color:#161207; border-color:var(--acc); font-weight:700}
button.link{background:none;border:0;color:var(--acc2);font:inherit;font-size:12.5px;cursor:pointer;padding:0}
button.link:hover{text-decoration:underline}

/* ============ form ============ */
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:13px}
.field label{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:1px}
input[type=text],input[type=number],select{background:#0b0e14; border:1px solid var(--line2); color:var(--text); font:inherit; padding:9px 12px; border-radius:8px; width:100%; font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none; border-color:var(--acc2)}
input[type=checkbox]{width:auto; accent-color:var(--acc); cursor:pointer}

/* ============ scheda gara + checklist ============ */
.racecard .title{font-size:19px; font-weight:700; margin-bottom:2px}
.racecard .sub{font-size:12px; color:var(--dim); margin-bottom:14px; text-transform:uppercase; letter-spacing:1px}
.ckl{display:grid; grid-template-columns:22px 168px 1fr; gap:8px; align-items:center; padding:7px 8px; border-bottom:1px solid #1d2430; cursor:pointer; border-radius:6px}
.ckl:hover{background:#ffffff05}
.ckl:last-of-type{border-bottom:0}
.ckl .k{color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.6px}
.ckl .v{font-weight:600; font-size:13.5px}
.ckl input{justify-self:center}
.ckl.done .k,.ckl.done .v{color:var(--faint); text-decoration:line-through}
.cklbar{height:4px; background:var(--panel3); border-radius:99px; overflow:hidden; margin:10px 0 4px}
.cklbar i{display:block; height:100%; background:var(--good); width:0; transition:width .25s}
.cklmeta{display:flex; justify-content:space-between; align-items:center; margin-top:4px}
.warnlist{margin:10px 0 0 16px; color:#e0c98a; font-size:13px}
.warnlist li{margin:3px 0}

/* ============ sottotab catalogo ============ */
.tabsmini{display:flex;gap:6px;margin-left:8px}

/* ============ banner / messaggi ============ */
.banner{border-radius:10px; padding:12px 16px; margin-top:12px; font-size:13.5px; line-height:1.6}
.banner svg{width:15px; height:15px; flex:none; vertical-align:-2px}
.banner.good{background:#4cc27a14; border:1px solid #4cc27a40; color:#bfe8cf}
.banner.bad{background:#e05d5d12; border:1px solid #e05d5d40; color:#f0c6c6}
.banner.warn{background:#e8a23a12; border:1px solid #e8a23a40; color:#f0dcb8}
.banner.info{background:#4d9fdb12; border:1px solid #4d9fdb40; color:#c5ddef}
.msg{padding:9px 0; border-bottom:1px solid #1d2430; font-size:13.5px; display:flex; gap:12px}
.msg:last-child{border-bottom:0}
.msg .d{color:var(--faint); font-size:11.5px; white-space:nowrap; padding-top:2px; font-variant-numeric:tabular-nums}
.msg.good .t{color:var(--good)} .msg.bad .t{color:var(--bad)} .msg.money .t{color:var(--warn)} .msg.title .t{color:var(--acc)}
.offer{display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; margin-top:8px; background:var(--panel2); flex-wrap:wrap}
.offer .n{font-weight:600}
.offer .m{margin-left:auto; display:flex; gap:8px; align-items:center}

/* ============ difficoltà ============ */
.diff-row{display:grid; grid-template-columns:26px 1fr 58px 58px 64px 64px 190px; gap:8px; align-items:center; padding:7px 4px; border-bottom:1px solid #1d2430; font-size:13.5px; font-variant-numeric:tabular-nums}
.diff-row:last-child{border-bottom:0}
.diff-row .nm{font-weight:600}
.diff-row .num{text-align:right; color:var(--dim); font-size:12.5px}
.diff-row .sl{font-weight:700; text-align:right; color:var(--text)}
.diff-row .rangebox{display:flex; align-items:center; gap:4px; justify-content:flex-end}
.diff-row .rangebox input{width:52px; padding:4px 6px; font-size:12.5px; text-align:center}
.diff-row .rangebox .dash{color:var(--faint)}
.diff-row .rangebox .pct{color:var(--faint); font-size:11px; margin-left:-2px}
.diff-row .rangebox .rc{padding:4px 7px}

/* ============ regole weekend (scheda gara) ============ */
.rs-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; align-items:end}
.rs-grid .field{margin-bottom:0}
@media(max-width:700px){.rs-grid{grid-template-columns:1fr}}

/* ============ grafico punti ============ */
.barchart{display:flex; align-items:flex-end; gap:6px; height:48px; margin-top:6px}
.barchart .bar{flex:1; background:linear-gradient(180deg,var(--acc) 0%,#9a6f22 100%); border-radius:3px 3px 0 0; min-height:4px; position:relative}
.barchart .bar.zero{background:var(--panel3)}
.barchart .bar:hover::after{content:attr(data-tip); position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%); background:#222b38; border:1px solid var(--line2); font-size:11px; padding:2px 8px; border-radius:6px; white-space:nowrap; z-index:5}

/* ============ onboarding ============ */
.hero{max-width:540px; margin:7vh auto 0}
.hero .kicker{text-align:center; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--acc); margin-bottom:8px}
.hero .big{text-align:center; font-size:27px; font-weight:700; margin-bottom:6px}
.hero .lead{text-align:center; color:var(--dim); margin-bottom:18px}
.hero form{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; margin-top:18px}
.setup-facts{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}

/* ============ modale ============ */
#modal-root:not(:empty){position:fixed; inset:0; background:#05070ae6; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px}
.modal{background:var(--panel); border:1px solid var(--line2); border-radius:14px; max-width:560px; width:100%; max-height:86vh; overflow:auto; box-shadow:0 20px 60px #000c}
.modal .mh{padding:16px 22px; border-bottom:1px solid var(--line); font-weight:700; font-size:16px; display:flex; align-items:center}
.modal .mh .x{margin-left:auto; background:none; border:0; color:var(--dim); font-size:20px; cursor:pointer; line-height:1}
.modal .mb{padding:18px 22px}
.modal .mf{padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end}
.winline{text-align:center; font-size:22px; font-weight:800; padding:6px 0 2px}
.winline.gold{color:var(--acc)}

/* ============ live (memoria condivisa) ============ */
.livebar{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:13px;margin-top:12px;flex-wrap:wrap}
.livebar .dot{margin-right:2px}
.livebar .st{font-weight:700}
.livebar .sep{color:var(--faint)}
.live-ok{border-color:#4cc27a55;background:#4cc27a10}
.live-bad{border-color:#e8a23a55;background:#e8a23a10}
.live-off{opacity:.75}
.ckrow{display:flex;align-items:center;gap:9px;padding:4px 2px;font-size:13px}
.ckrow .k{color:var(--dim);min-width:130px;text-transform:capitalize}
.ckrow .exp{color:var(--faint);text-decoration:line-through}
.ckrow .lv{font-weight:600}
.ckrow .mark{width:16px;text-align:center}

/* ============ toast ============ */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:70; display:flex; flex-direction:column; gap:8px; align-items:center}
#toast .t{background:#1e2530; border:1px solid var(--line2); border-radius:10px; padding:10px 18px; font-size:13.5px; max-width:580px; box-shadow:0 8px 28px #000a}
#toast .t.err{border-color:#e05d5d66; background:#2a1c1c}
#toast .t.ok{border-color:#4cc27a66}

.spin{display:inline-block; width:14px; height:14px; border:2px solid var(--dim); border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none !important}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.spread{justify-content:space-between}
.empty{color:var(--faint); font-size:13px; padding:6px 0}

/* ============ cornice foto auto (pagina Auto) ============ */
.car-frame{outline:1px solid #ffffff26; outline-offset:-1px}
</style>
</head>
<body>

<aside id="side">
  <div class="brand">
    <svg class="stripes" viewBox="0 0 26 18" aria-hidden="true">
      <rect x="0" y="0" width="6" height="18" rx="1.5" fill="#d9a83e"/>
      <rect x="10" y="3" width="6" height="15" rx="1.5" fill="#c23b3b"/>
      <rect x="20" y="6" width="6" height="12" rx="1.5" fill="#4d9fdb"/>
    </svg>
    <div class="t"><b>EVO Career</b><span>Team Manager</span></div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">Assetto Corsa EVO · tool locale<br>tutto resta sul tuo PC</div>
</aside>

<div id="shell">
  <header id="top">
    <div class="in">
      <div class="idblock hidden" id="idblock">
        <div class="avatar" id="t-ava">–</div>
        <div>
          <div class="nm" id="t-name">–</div>
          <div class="sub" id="t-sub">–</div>
        </div>
      </div>
      <div class="hstats hidden" id="hstats">
        <div class="hstat"><span class="l">Banca</span><span class="v money" id="t-money">–</span></div>
        <div class="hstat"><span class="l">Reputazione</span><span class="v rep" id="t-rep">–</span></div>
        <div class="hstat" id="hstat-heritage" style="display:none"><span class="l">Eredità</span><span class="v" id="t-heritage" title="capitoli di famiglia completati">–</span></div>
        <div class="hstat"><span class="l">Stagione</span><span class="v" id="t-season">–</span></div>
        <div class="hstat"><span class="l">Gioco</span><span class="v" style="font-size:12.5px;font-weight:500"><span class="dot" id="dot-evo"></span><span id="t-evo">chiuso</span></span></div>
        <div class="hstat"><span class="l">MoTeC</span><span class="v" style="font-size:12.5px;font-weight:500"><span class="chip hidden" id="motec-strip"></span></span></div>
      <div class="hstat" style="border-right:0"><span class="l">In pista</span><span class="v" style="font-size:12.5px;font-weight:500"><span class="chip hidden" id="live-strip"></span></span></div>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
'use strict';
/* ============================== infrastruttura ============================== */
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(String(e.message)); });
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => Number(n ?? 0).toLocaleString('it-IT');
const api = (action, body={}) => fetch(`/api/${action}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
  .then(async r => { const d = await r.json(); if (!r.ok) throw Object.assign(new Error(d.error || 'errore'), {data:d}); return d; });

function toast(text, kind='') {
  const t = document.createElement('div');
  t.className = 't ' + kind; t.textContent = text;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 8000 : 4200);
}

function modal(title, bodyHtml, buttons){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal"><div class="mh">${esc(title)}<button class="x" aria-label="chiudi">×</button></div>
    <div class="mb">${bodyHtml}</div><div class="mf"></div></div>`;
  const foot = $('.mf', root);
  for (const [label, cls, fn] of buttons) {
    const b = document.createElement('button');
    b.className = cls; b.textContent = label;
    b.onclick = () => { if (fn(root, b) !== false) root.innerHTML = ''; };
    foot.appendChild(b);
  }
  $('.x', root).onclick = () => root.innerHTML = '';
  root.onclick = (e) => { if (e.target === root) root.innerHTML = ''; };
  return root;
}

/* ============================== viste ============================== */
async function render(){
  const m = $('#main');
  if (!boot) return;
  if (!boot.hasCareer) return drawOnboarding(m);
  paintHeader(boot.header);
  m.innerHTML = '<div class="panel"><span class="spin"></span></div>';
  try {
    if (tab==='dashboard')  return await drawDashboard(m);
    if (tab==='rivals')     return await drawRivals(m);
    if (tab==='calendar')   return await drawCalendar(m);
    if (tab==='standings')  return await drawStandings(m);
    if (tab==='series')     return await drawSeries(m);
    if (tab==='tracks')     return await drawTracks(m);
    if (tab==='cars')       return await drawCars(m);
    if (tab==='garage')     return await drawGarage(m);
    if (tab==='paddock')    return await drawPaddock(m);
    if (tab==='catalog')    return await drawArchive(m);
    if (tab==='archive')    return await drawArchive(m);
    if (tab==='stats')      return await drawStats(m);
    if (tab==='gazzetta')   return await drawGazzetta(m);
    if (tab==='import')     return await drawImport(m);
    if (tab==='setup')      return await drawSetup(m);
    if (tab==='difficulty') return await drawDifficulty(m);
    if (tab==='messages')   return await drawMessages(m);
    if (tab==='settings')   return drawSettings(m);
  } catch(e){ m.innerHTML = `<div class="panel"><div class="banner bad">${esc(e.message)}</div></div>`; }
}

function paintHeader(h){
  $('#idblock').classList.remove('hidden');
  $('#hstats').classList.remove('hidden');
  $('#t-ava').textContent = (h.driver.name || '?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  $('#t-name').textContent = h.driver.name;
  $('#t-sub').textContent = `${h.nation ?? ''} · ${h.sponsor ?? 'pilota privato'} · ${h.node.display}`;
  $('#t-money').textContent = money(h.money) + ' €';
  $('#t-rep').textContent = String(h.rep);
  $('#t-season').textContent = `S${h.season} · R${h.round}/${h.rounds}`;
  if (h.heritage) {
    $('#hstat-heritage').style.display = '';
    $('#t-heritage').textContent = `📜 ${h.heritage.completed ?? 0}${h.heritage.activeDone ? ' · eredità pronta!' : ''}`;
    $('#hstat-heritage').title = h.heritage.activeDone ? "Un'eredità di famiglia è pronta da incassare (pannello Eredità)" : 'Capitoli della saga di famiglia completati';
  }
}

async function refreshBoot(){
  boot = await api('boot');
  $('#dot-evo').classList.toggle('on', !!boot.gameRunning);
  $('#t-evo').textContent = boot.gameRunning ? 'EVO aperto' : 'chiuso';
  drawNav();
  if (boot.hasCareer) paintHeader(boot.header);
}

/* -------- cruscotto -------- */
async function drawDashboard(m){
  const [st, card] = await Promise.all([api('status'), api('card')]);
  const h = st.header, d = st.difficulty, node = h.node;
  const res = st.results;
  const races = res.length;
  const wins = res.filter(r=>!r.dnf && r.position===1).length;
  const podiums = res.filter(r=>!r.dnf && r.position<=3).length;
  const pts = res.reduce((a,r)=>a+r.points,0);
  const fls = res.filter(r=>r.fl).length;
  const prize = res.reduce((a,r)=>a+(r.prize||0),0);
  const played = res.length;
  const total = card.totalRounds ?? h.rounds;
  const maxPts = Math.max(1, ...res.map(r=>r.points));

  m.innerHTML = `
  <div class="grid2">
    <div>
      <div class="panel hero">
        <svg class="flagart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 2h1.6v20H4z"/><path d="M5.6 3h12.8l-3 4.5 3 4.5H5.6z"/></svg>
        <h2>${LI.flag} ${esc(node.display)} · stagione ${h.season}</h2>
        <div class="seasonprog">
          <div class="sp-bar"><i style="width:${total ? Math.min(100, Math.round(played/total*100)) : 0}%"></i></div>
          <div class="sp-meta"><span>${card.seasonDone ? 'calendario completato' : `prossima gara: <b style="color:var(--text)">${esc(card.roundName)}</b>`}</span><span>${played}/${total} gare disputate</span></div>
        </div>
        <div class="grid3">
          <div class="kpi"><div class="kpi-top"><span class="kico">${LI.gauge}</span><div class="l">Classifica</div></div><div class="v acc">P${h.position ?? '–'}<small>/${h.gridSize}</small></div></div>
          <div class="kpi"><div class="kpi-top"><span class="kico">${LI.bolt}</span><div class="l">Punti</div></div><div class="v acc2">${pts}</div></div>
          <div class="kpi"><div class="kpi-top"><span class="kico">${LI.trophy}</span><div class="l">Vittorie</div></div><div class="v">${wins}</div></div>
          <div class="kpi"><div class="kpi-top"><span class="kico">${LI.medal}</span><div class="l">Podi</div></div><div class="v">${podiums}</div></div>

          <button class="qtile" id="b-gazzetta">${LI.news}<span><b>Gazzetta del paddock</b><small>la stampa racconta le tue gare</small></span></button>
          <button class="qtile" id="b-piano">${LI.compass}<span><b>Pianificatore di carriera</b><small>dove puoi correre la prossima stagione</small></span></button>
          <button class="qtile" id="b-integrity-quick">${LI.shield}<span><b>Verifica integrità</b><small>controllo di coerenza della carriera</small></span></button>
        </div>
      </div>
    </div>
    <div class="racecard panel" id="card-panel"></div>
  </div>`;
  drawCardInto($('#card-panel'), card);
  drawLifePanel();
  drawHeritagePanel();
  drawEventsPanel();

  $('#b-gazzetta').onclick = () => showGazzetta();

  $('#b-integrity-quick').onclick = async () => {

    } catch(e){ toast(e.message,'err'); }
  };
}

async function showReview(){
  try {
    const integ = await api('integrity');
    const seasons = integ.seasons ?? [];
    if (!seasons.length) return toast('Ancora nessuna gara disputata.', 'warn');
    const r = await api('season-review', { season: seasons[0] });
    const draw = (rev) => {
      modal(`Stagione ${rev.season} — ${rev.node}`, `
        <div style="max-height:60vh;overflow:auto">
          ${rev.champion?'<div class="banner good" style="margin-bottom:10px">🏆 CAMPIONE!</div>':''}
          <div class="muted" style="margin-bottom:10px">${rev.stats.races} gare · ${rev.stats.wins} vittorie · ${rev.stats.podiums} podi · ${rev.stats.poles} pole · ${rev.stats.fls} giri veloci · ${rev.stats.points} punti · ${money(rev.stats.prize)} € di premi</div>
          <pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.55">${esc(rev.text)}</pre>
        </div>`,
        [ ...seasons.filter(s=>s!==rev.season).slice(0,2).map(s=>[`Stagione ${s}`,'ghost',()=>{ api('season-review',{season:s}).then(draw).catch(e=>toast(e.message,'err')); }]),
          ['Salva su file','ghost',async()=>{ try{ const r=await api('review-export',{season:rev.season}); toast('Rassegna salvata in '+r.file,'ok'); }catch(e){ toast(e.message,'err'); } }],
          ['Copia testo','ghost',async()=>{ try{ await navigator.clipboard.writeText(rev.text); toast('Rassegna copiata.','ok'); }catch{ toast('Appunti negati.','err'); } }],
          ['Chiudi','ghost',()=>{}]]);
    };
    draw(r);
  } catch(e){ toast(e.message, 'err'); }
}

      ${v.contract.rows.map(c=>`<div style="font-size:12.5px;margin-top:3px">${c.decided===false?'<span style="color:var(--bad)">✗</span>':c.ok?'<span style="color:var(--good)">✓</span>':'•'} ${esc(c.text)} — <span class="muted">${esc(c.progress)}</span></div>`).join('')}</div></div>`);

    if (v.sponsorActive) rows.push(`<div class="liferow"><span class="lico green">${LI.handshake}</span><div class="lt"><b>${esc(v.sponsorActive.name)}</b><div style="font-size:12.5px">${money(v.sponsorActive.perRace)} € a gara${v.sponsorActive.missionDone?' · missione completata ✓':` · missione: podio entro R${v.sponsorActive.deadlineRound+1} (+${money(v.sponsorActive.bonus)} €)`}</div></div></div>`);

    $('#b-sponsor-sign')?.addEventListener('click', async ()=>{ try{ await api('sponsor-accept',{tier:999}); toast('Sponsor firmato.','ok'); drawLifePanel(); }catch(e){toast(e.message,'err')} });
    $('#b-sponsor-no')?.addEventListener('click', async ()=>{ try{ await api('sponsor-decline',{}); toast('Proposta rifiutata.','ok'); drawLifePanel(); }catch(e){toast(e.message,'err')} });
    $('#b-chal-acc')?.addEventListener('click', async ()=>{ try{ await api('challenge-accept',{}); toast('Sfida accettata: in bocca al lupo.','ok'); drawLifePanel(); }catch(e){toast(e.message,'err')} });
  } catch { el.innerHTML = '<h2>Vita fuori pista</h2><div class="empty">Non disponibile.</div>'; }

async function drawEventsPanel(){
  const el = $('#p-events'); if (!el) return;
  try {
    const v = await api('events');
    if (!v.active && !(v.showCase ?? []).length && !(v.history ?? []).length){
      el.innerHTML = `<h2>Eventi speciali</h2><div class="empty">Nessun invito per ora: gli organizzatori ti cercano quando il paddock comincia a conoscerti.</div>`;
      return;
    }
    let html = '<h2>Eventi speciali</h2>';
    if (v.active){
      const a = v.active, c = v.card;
      const pending = !a.acceptedAt;
      html += `<div class="banner ${pending ? 'info' : 'good'}" style="margin-bottom:8px">
        <b>⭐ ${esc(a.theme.name)}</b> <span class="tag" style="font-size:10px;padding:1px 6px">${a.tier === 'finale' ? 'FINALE DI STAGIONE' : 'invito speciale'}</span><br>
        <span class="muted" style="font-size:12.5px">${esc(a.theme.intro)}</span><br>
        <span style="font-size:12.5px;margin-top:4px;display:inline-block">🏁 ${esc(a.trackDisplay)} · ${a.laps} giri · ${a.guests.join(' · ')} · premio: <b>${a.prize.duplicateCash ? money(a.prize.money) + ' €' : esc(a.prize.carName) + ' + ' + money(a.prize.money) + ' €'}</b>${a.prize.rep ? ` · +${a.prize.rep} rep` : ''}${a.tier !== 'finale' && !a.acceptedAt ? ` · <span class="muted">scade dopo ${a.deadlineRounds} gare di campionato</span>` : ''}</span>
      </div>`;
      if (pending){
        html += `<div class="row"><button class="act" id="b-ev-acc">Accetto l'invito</button><button class="ghost" id="b-ev-dec">Rifiuta</button></div>`;
      } else {
        html += `<details open style="margin:6px 0"><summary style="cursor:pointer;font-size:12.5px"><b>📋 Scheda da impostare in EVO</b> <span class="muted" style="font-size:11px">— spuntala come la gara di campionato</span></summary>
          <table style="margin-top:6px"><tbody>${c.settings.map((s,i)=>`<tr><td style="width:130px" class="muted">${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join('')}</tbody></table>
          <div class="muted" style="margin-top:6px;font-size:12px">Difficoltà AI consigliata per la tua serie: ${'→'} usa gli slider della scheda gara normale. Se ti serve, guarda il pannello Prossima gara.</div>
        </details>
        <div class="row" style="margin-top:8px;flex-wrap:wrap;align-items:end">
          <label class="muted">Posizione d'arrivo<br><input type="number" id="i-ev-pos" min="1" max="30" value="1" style="width:80px"></label>
          <label class="muted">Miglior giro (secondi, opzionale)<br><input type="number" id="i-ev-lap" step="0.1" min="20" max="1200" style="width:100px" placeholder="es. 102.4"></label>
          <button class="act" id="b-ev-fin">Registra il risultato</button>
          <button class="ghost" id="b-ev-aban">Ripensamento</button>
        </div>`;
      }
    }
    if ((v.showCase ?? []).length){
      html += `<h3 style="margin-top:10px">🏆 La tua vetrina</h3><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${v.showCase.map(c=>`<span class="tag good" style="font-size:11.5px;padding:4px 10px">${esc(c.carName)} <span class="muted">· ${esc(c.theme)} · S${c.season}</span></span>`).join('')}</div>`;
    }
    if ((v.history ?? []).length){
      html += `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:12px">Storia eventi (${v.history.length})</summary><table style="margin-top:6px"><thead><tr><th>Quando</th><th>Evento</th><th>Esito</th></tr></thead><tbody>${v.history.map(h2=>`<tr><td class="muted">${esc(String(h2.finishedAt ?? h2.declinedAt ?? h2.createdAt ?? '').slice(0,10))}</td><td>${esc(h2.theme?.name ?? '')}</td><td>${h2.outcome==='won'?'<span class="tag good">vinto</span>':h2.outcome==='declined'?'<span class="muted">rifiutato</span>':h2.outcome==='expired'?'<span class="muted">scaduto</span>':`P${h2.position ?? '—'}`}</td></tr>`).join('')}</tbody></table></details>`;
    }
    el.innerHTML = html;
    $('#b-ev-acc')?.addEventListener('click', async ()=>{ try{ await api('event-accept',{eventId:v.active.id}); toast('Invito accettato: la scheda è pronta.','ok'); refreshBoot().then(render); }catch(e){toast(e.message,'err')} });
    $('#b-ev-dec')?.addEventListener('click', async ()=>{ try{ await api('event-decline',{eventId:v.active.id}); toast('Invito rifiutato.','ok'); refreshBoot().then(render); }catch(e){toast(e.message,'err')} });
    $('#b-ev-fin')?.addEventListener('click', async ()=>{
      try{
        const pos = Number($('#i-ev-pos').value);
        if (!Number.isFinite(pos) || pos < 1) return toast('Inserisci la posizione d\'arrivo.','err');
        const lapRaw = $('#i-ev-lap')?.value;
        const lap = lapRaw ? Number(lapRaw) : null;
        const r = await api('event-finish',{position:pos, bestLapSec:lap});
        const res = r.result;
        if (res.won && res.showcaseEntry) toast('🏆 ' + res.showcaseEntry.carName + ' è tua! Entra in vetrina.','ok');
        else if (res.money > 0) toast('Evento chiuso P' + res.position + ': +' + money(res.money) + ' €','ok');
        else toast('Evento chiuso P' + res.position + '.','warn');
        refreshBoot().then(render);
      }catch(e){toast(e.message,'err')}
    });
    $('#b-ev-aban')?.addEventListener('click', async ()=>{ try{ await api('event-abandon',{}); toast('Invito liberato: puoi decidere ancora.','ok'); refreshBoot().then(render); }catch(e){toast(e.message,'err')} });
  } catch { el.innerHTML = '<h2>Eventi speciali</h2><div class="empty">Non disponibile.</div>'; }
}

function drawCardInto(el, card){
  if (card.seasonDone){
    el.innerHTML = `<h2>${LI.medal} Stagione completata</h2>
      <div class="muted">Hai chiuso il calendario di ${esc(card.nodeDisplay)}: arriva il momento del bilancio e delle offerte.</div>
      <div class="row" style="margin-top:16px"><button class="act" id="b-season-end">Chiudi la stagione</button></div>`;
    $('#b-season-end', el).onclick = () => seasonEndFlow(false);
    return;
  }
  const key = 'evo-ckl:' + card.nodeDisplay + ':' + (card.roundIndex+1);
  let checked = [];
  try { checked = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
  const isDone = (i) => checked.includes(i);
  const doneCount = card.settings.filter((_,i)=>isDone(i)).length;    el.innerHTML = `<h2>${LI.flag} Prossima gara <span class="h-act">R${card.roundIndex+1} di ${card.totalRounds}</span></h2>
    <div class="title">${CFLAG} ${esc(card.roundName)}</div>
    <div class="sub">${esc(card.nodeDisplay)} · iscrizione ${money(card.entryFee)} € · si paga una volta per round</div>
    ${card.carImage ? `<div style="display:flex;align-items:center;gap:12px;margin:8px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2,#121822)">
      <img src="${card.carImage}" alt="${esc(card.carName ?? '')}" style="width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#0d1118">

    ${card.outlook ? `<div style="margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2,#151a24)">

      <div style="font-size:12px;margin-bottom:4px"><b>Stagione</b> · ${card.outlook.standingPosition?`P${card.outlook.standingPosition} in classifica · `:''}${card.outlook.racesRun}/${card.outlook.totalRounds} gare corse · ${card.outlook.seasonPoints} punti${card.outlook.duel?` · ⚔️ duello con <b>${esc(card.outlook.duel.name)}</b> a ${card.outlook.duel.gap} pt`:''}${card.outlook.crowd?` · <span title="stima spettatori dalla pista (stile audience di Zero to Apex)">🧑‍🤝‍🧑 ${(card.outlook.crowd/1000).toFixed(0)}k attesi</span>`:''}</div>
      ${card.outlook.contract?.length ? `<div style="font-size:12px;margin-bottom:4px"><b>Contratto</b> · ${card.outlook.contract.map(c=>`<span title="${esc(c.progress)}" style="white-space:nowrap">${c.decided===false?'<span style="color:var(--bad)">✗</span>':c.ok?'<span style="color:var(--good)">✓</span>':'•'} ${esc(c.text.split(' ').slice(0,4).join(' '))}…</span>`).join(' ')}</div>` : ''}
    ${(card.timeMultiplier ?? 1) !== 1 ? `<div style="font-size:12px;margin-bottom:4px"><b>Tempo</b> · moltiplicatore consigliato: <b>${card.timeMultiplier}x</b> <span class="muted">(col gioco che corre più in fretta il pomeriggio si comprime: le ore di sessione restano quelle del calendario)</span></div>` : ''}
      ${card.outlook.rivals?.length ? `<div style="font-size:12px"><b>Rivali già visti</b> · ${card.outlook.rivals.map(r=>`<span class="chip ${r.h2h.beats>r.h2h.losses?'':'gold'}" style="font-size:10px;padding:1px 6px" title="tu-lui: ${r.h2h.losses}-${r.h2h.beats}">${esc(r.name.split(' ')[0])} ${r.h2h.losses}-${r.h2h.beats}</span>`).join(' ')}</div>` : ''}
    </div>` : ''}
    ${card.outlook?.trackInfo ? `<div style="margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2,#121822);display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      ${card.outlook.trackInfo.map ? `<img src="${card.outlook.trackInfo.map}" alt="tracciato di ${esc(card.trackName)}" style="width:180px;height:118px;flex:none;object-fit:contain;background:#000;border-radius:8px;padding:8px${card.outlook.trackInfo.map.endsWith('.svg')?';filter:invert(1);opacity:.92':''}">` : (card.outlook.trackInfo.outline ? `<svg viewBox="0 0 100 64" style="width:170px;height:110px;flex:none;background:#0d1118;border-radius:8px;padding:6px" aria-label="tracciato di ${esc(card.trackName)}"><path d="${card.outlook.trackInfo.outline}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>` : '')}
      <div style="flex:1;min-width:230px">
        <div style="font-size:13px;margin-bottom:5px"><b>${flagOf(card.outlook.trackInfo.country)} ${esc(card.trackName)}</b> <span class="muted">· ${esc(card.outlook.trackInfo.nick)} · ${esc(card.outlook.trackInfo.country)}, ${card.outlook.trackInfo.lengthKm} km, ${card.outlook.trackInfo.corners} curve, dal ${card.outlook.trackInfo.opened}</span></div>
        ${card.outlook.trackRec ? `<div style="font-size:12.5px"><b>🏁 Giro più veloce in pista</b> · <b style="color:var(--acc);font-size:15px">${esc(card.outlook.trackRec.time)}</b> — ${esc(card.outlook.trackRec.driver)}${card.outlook.trackRec.mine?' <span class="tag green" style="font-size:10px;padding:1px 6px">tu</span>':''}<br><span class="muted">${esc(card.outlook.trackRec.car ?? '')}${card.outlook.trackRec.sameCar?'':' · altra auto'} · ${esc((card.outlook.trackRec.at ?? '').slice(0, 10))}${card.outlook.lapTarget&&card.outlook.lapTarget.time!==card.outlook.trackRec.time?` · il tuo migliore: ${esc(card.outlook.lapTarget.time)}`:''}</span></div>` : ''}
        <details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">📖 la storia di ${esc(card.trackName)}</summary>
        <div class="muted" style="margin-top:5px;font-size:12px;line-height:1.55">${esc(card.outlook.trackInfo.history)}</div>
        <button class="mini" style="margin-top:6px" onclick="document.querySelector('#nav button[data-tab=tracks]').click()">Apri il libro delle piste</button></details>
      </div>
    </div>` : ''}
    ${card.heritageActive ? `<div class="banner warn" style="margin-top:10px">📜 <b>Impresa di famiglia: ${esc(card.heritageActive.title)}</b> — ${esc(card.heritageActive.ancestor)}, tuo ${esc(card.heritageActive.relation)} (${esc(card.heritageActive.era)}). Questa gara vale per l'obiettivo «${esc(card.heritageActive.objective)}» (${card.heritageActive.done}/${card.heritageActive.total} superate · eredità ${money(card.heritageActive.inherit)} €).</div>` : ''}
    ${!card.heritageActive && card.heritageHint ? `<div class="banner info" style="margin-top:10px">📜 L'impresa di famiglia ${card.heritageHint ? 'prosegue a <b>'+esc(card.heritageHint)+'</b>' : ''}: corri la ronda indicata per farla contare (vedi pannello Eredità).</div>` : ''}
    ${card.challenge && !card.challenge.verdict ? `<div class="banner ${card.challenge.accepted?'info':'warn'}" style="margin-top:10px">${LI.target} <b>Sfida della ronda</b> — ${esc(card.challenge.text)}<br><span class="muted">facoltativa · premio ${money(card.challenge.reward)} € se ci riesci · −${card.challenge.penalty} rep se fallisci${card.challenge.accepted?' · <b>accettata</b>':''}</span>${card.challenge.accepted?'':' <button class="mini" id="b-accept-chal" style="margin-top:6px">Accetta la sfida</button>'}</div>` : ''}
    ${card.pendingNudge ? `<div class="banner warn" style="margin-top:10px"><b>🚀 La serie è troppo facile?</b> ${esc(card.pendingNudge.reason)} su ${esc(card.pendingNudge.nodeDisplay)}.<br>
      <button class="mini" id="b-nudge-apply" style="margin-top:6px">Applica +1 alla banda della serie</button>
      <button class="mini" id="b-nudge-skip" style="margin-top:6px;margin-left:6px">No, va bene così</button></div>` : ''}
    ${card.pendingProposal ? `<div class="banner warn" style="margin-top:10px"><b>🎯 Il tool suggerisce il trim</b> ${esc(card.pendingProposal.reason)}: trim ${card.pendingProposal.from >= 0 ? '+' : ''}${card.pendingProposal.from} → <b>${card.pendingProposal.to >= 0 ? '+' : ''}${card.pendingProposal.to}</b>. Accettare sposta anche la banda EVO della serie di ${Math.abs((card.pendingProposal.to - card.pendingProposal.from) * 5)} punti (${card.pendingProposal.to > card.pendingProposal.from ? 'in salita' : 'in discesa'}).<br>
      <button class="mini" id="b-prop-accept" style="margin-top:6px">Accetta (trim ${card.pendingProposal.to >= 0 ? '+' : ''}${card.pendingProposal.to})</button>
      <button class="mini" id="b-prop-reject" style="margin-top:6px;margin-left:6px">Rifiuta</button></div>` : ''}
    ${card.difficulty?.trim >= (20) ? `<div class="banner warn" style="margin-top:10px"><b>Difficoltà al massimo</b> — il trim adattivo è arrivato a +20 e la serie resta troppo facile: il passo successivo è passare a una serie più alta (bottone 🎯 nel cruscotto).</div>` : ''}
    <div class="panel" style="margin-top:12px; padding:14px 16px" id="rs-panel">
      <h2 style="margin-bottom:10px">${LI.gauge} Regole di questo weekend <span class="h-act">lo slider EVO va da 0 a 100% e si imposta come intervallo</span></h2>
      <div class="rs-grid">
        <div class="field"><label>Difficoltà AI — minimo (consigliato ${Math.max(0,card.difficulty.slider-5)}%)</label>
          <div class="row"><input type="range" id="rs-dmin" min="0" max="100" step="1" value="${card.difficulty.rangeMin}" style="flex:1;padding:0"><b id="rs-dmin-v" style="min-width:44px;text-align:right">${card.difficulty.rangeMin}%</b></div>
        </div>
        <div class="field"><label>Difficoltà AI — massimo (consigliato ${Math.min(100,card.difficulty.slider+5)}%)</label>
          <div class="row"><input type="range" id="rs-dmax" min="0" max="100" step="1" value="${card.difficulty.rangeMax}" style="flex:1;padding:0"><b id="rs-dmax-v" style="min-width:44px;text-align:right">${card.difficulty.rangeMax}%</b></div>
        </div>
        <div class="field"><label>Inizio prove libere (ora del gioco)</label><input type="number" id="rs-pstart" min="0" max="23" value="${card.practiceStart}"></div>
        <div class="field"><label>Inizio qualifiche (ora del gioco)</label><input type="number" id="rs-qstart" min="0" max="23" value="${card.qualifyStart}"></div>
        <div class="field"><label>Moltiplicatore tempo</label>
          <select id="rs-time">${[1,2,3,4,5,6,8,10,12,24].map(t=>`<option value="${t}" ${t===(card.timeMultiplier??1)?'selected':''}>${t}x</option>`).join('')}</select>
        </div>
        <div class="field"><label>Distanza gara <span class="faint">(piena: ${card.baseLaps ?? card.round.laps} giri · premio ${money(card.prizeFull ?? card.round.econ?.prize)} €)</span></label>
          <select id="rs-dist">${[100,75,50,25].map(p=>`<option value="${p}" ${p===(card.distPct??100)?'selected':''}>${p}% — ${Math.max(2,Math.round((card.baseLaps ?? card.round.laps)*p/100))} giri · premio fino a ${money(Math.round((card.prizeFull ?? 0)*p/100))} €</option>`).join('')}</select>
        </div>
        <div class="row" style="align-items:end"><button class="mini" id="rs-save">Salva regole</button><button class="mini" id="rs-reset">Torna ai consigli</button></div>
      </div>
      <div class="muted" style="font-size:11.5px;margin-top:8px">Aggressività AI: in EVO è ancora bloccata (grigia), il tool la mostra solo come riferimento (${card.aggression}% consigliato). Consigli = difficoltà adattiva ±5 + orari calcolati sull'ora di gara; “Torna ai consigli” azzera le tue scelte.</div>
    </div>
    <div style="margin-top:8px">
      ${card.settings.map(([k,v],i)=>{
        const isDiff = k === 'Difficoltà AI';
        return `<div class="ckl ${isDone(i)?'done':''}" style="display:flex;align-items:center;gap:8px">
          <label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer"><input type="checkbox" data-i="${i}" ${isDone(i)?'checked':''}><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></label>
          ${isDiff?`<span class="row" style="gap:4px;margin:0" title="la gara è stata troppo facile? alza o abbassa la banda di 1 punto: vale per la serie (qualsiasi auto) e si riflette anche nella pagina Difficoltà">
            <button class="mini d-nudge" data-d="-1" style="padding:1px 8px">−1</button>
            <button class="mini d-nudge" data-d="+1" style="padding:1px 8px">+1</button>
          </span>`:''}
        </div>`;
      }).join('')}
    </div>
    ${card.warnings.length ? `<ul class="warnlist">${card.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <div class="row" style="margin-top:16px">
      <select id="sel-car" style="flex:1;min-width:200px">${card.carChoices.map(c=>`<option value="${esc(c.id)}"${c.id===card.car?' selected':''}>${esc(c.display)}</option>`).join('')}</select>
      <button class="ghost" id="b-copy">Copia scheda</button>
    </div>
    <button class="act" id="b-race" style="width:100%;margin-top:10px">Iscriviti e apri EVO</button>
    <div class="muted" style="margin-top:10px">Imposta i campi nella gara personalizzata di EVO spuntando la lista qui sopra; a scheda completa, premi Invio.</div>`;
  const save = () => {
    checked = $$('.ckl input', el).filter(c=>c.checked).map(c=>Number(c.dataset.i));
    localStorage.setItem(key, JSON.stringify(checked));
    $$('.ckl', el).forEach((row,i)=>row.classList.toggle('done', checked.includes(i)));
    $('.cklbar i', el).style.width = (checked.length/card.settings.length*100) + '%';
    $('.cklmeta .muted', el).textContent = `checklist di configurazione: ${checked.length}/${card.settings.length}`;
    if (checked.length === card.settings.length) toast('Scheda completa: sei pronto a partire in EVO.', 'ok');
  };
  $$('.ckl input', el).forEach(c => c.onchange = save);
  $('#b-ckl-reset', el).onclick = (e) => { e.preventDefault(); localStorage.removeItem(key); drawCardInto(el, card); };
  // pannello "regole del weekend": intervallo slider AI (min-max come in EVO), orari, moltiplicatore
  const rsWire = (id, vid, suffix='') => {
    const inp = $(id, el); if (!inp) return;
    inp.oninput = () => { $(vid, el).textContent = inp.value + suffix; };
  };
  rsWire('#rs-dmin', '#rs-dmin-v', '%');
  rsWire('#rs-dmax', '#rs-dmax-v', '%');
  $('#rs-save', el)?.addEventListener('click', async () => {
    try {
      await api('race-settings', {
        sliderMin: Number($('#rs-dmin', el).value),
        sliderMax: Number($('#rs-dmax', el).value),
        practiceStart: Number($('#rs-pstart', el).value),
        qualifyStart: Number($('#rs-qstart', el).value),
        timeScale: Number($('#rs-time', el).value),
        distPct: Number($('#rs-dist', el).value),
      });
      toast('Regole salvate: valle a impostare in EVO.', 'ok');
      drawCardInto(el, await api('card', { car: $('#sel-car', el)?.value ?? null }));
    } catch(e){ toast(e.message, 'err'); }
  });
  $('#rs-reset', el)?.addEventListener('click', async () => {
    try {
      await api('race-settings', { clear: true });
      toast('Tornati i consigli del tool.', 'ok');
      drawCardInto(el, await api('card', { car: $('#sel-car', el)?.value ?? null }));
    } catch(e){ toast(e.message, 'err'); }
  });
  $('#b-accept-chal', el)?.addEventListener('click', async () => {
    try { await api('challenge-accept', {}); toast('Sfida accettata: in bocca al lupo.', 'ok'); drawCardInto(el, await api('card', { car: $('#sel-car', el)?.value ?? null })); }
    catch(e){ toast(e.message, 'err'); }
  });
  $$('.d-nudge', el).forEach(b => b.onclick = async (e) => {
    e.preventDefault();
    try {
      const out = await api('difficulty-nudge', { delta: Number(b.dataset.d), car: $('#sel-car', el)?.value ?? null });
      drawCardInto(el, out.card);
      toast(`Difficoltà serie: ${out.card.difficulty.rangeMin}–${out.card.difficulty.rangeMax}%.`, 'ok');
    } catch(err){ toast(err.message, 'err'); }
  });
  $('#b-nudge-apply', el)?.addEventListener('click', async () => {
    try {
      const out = await api('difficulty-nudge', { delta: Number(card.pendingNudge?.delta ?? 1), car: $('#sel-car', el)?.value ?? null });
      drawCardInto(el, out.card);
      toast(`Difficoltà serie: ${out.card.difficulty.rangeMin}–${out.card.difficulty.rangeMax}%.`, 'ok');
    } catch(err){ toast(err.message, 'err'); }
  });
  $('#b-nudge-skip', el)?.addEventListener('click', async () => {
    try { await api('nudge-dismiss', {}); drawCardInto(el, await api('card', { car: $('#sel-car', el)?.value ?? null })); toast('Suggerimento scartato.', 'info'); }
    catch(err){ toast(err.message, 'err'); }
  });
  $('#b-prop-accept', el)?.addEventListener('click', async () => {
    try {
      await api('difficulty-action', { op: 'accept' });
      drawCardInto(el, await api('card', { car: $('#sel-car', el)?.value ?? null }));
      toast('Suggerimento accettato: trim aggiornato, banda EVO spostata.', 'ok');
      await refreshBoot();
    } catch(err){ toast(err.message, 'err'); }
  });
  $('#b-prop-reject', el)?.addEventListener('click', async () => {
    try {
      await api('difficulty-action', { op: 'reject' });
      drawCardInto(el, await api('card', { car: $('#sel-car', el)?.value ?? null }));
      toast('Suggerimento rifiutato.', 'info');
    } catch(err){ toast(err.message, 'err'); }
  });
  $('#sel-car', el).onchange = async () => drawCardInto(el, await api('card', {car: $('#sel-car', el).value}));
  $('#b-copy', el).onclick = async () => {
    const text = `${card.nodeDisplay} — ${card.roundName} (R${card.roundIndex+1}/${card.totalRounds})\n` +
      card.settings.map(([k,v])=>`${k}: ${v}`).join('\n') + `\nDifficoltà AI: ${card.difficulty.slider}% · aggressività ${card.aggression}%`;
    try { await navigator.clipboard.writeText(text); toast('Scheda copia negli appunti.', 'ok'); }
    catch { toast('Il browser ha negato gli appunti.', 'err'); }
  };
  // banda live: stato della memoria condivisa + verifica automatica della config
  const liveBox = document.createElement('div');
  liveBox.className = 'livebar live-off';
  liveBox.innerHTML = '<span class="dot"></span><span class="st">Live</span><span class="muted">in attesa del gioco…</span>';
  el.appendChild(liveBox);
  const pollLive = async () => {
    if (!document.body.contains(liveBox)) return;
    try {
      const car = $('#sel-car', el)?.value ?? null;
      const r = await api('live', { car });
      if (!document.body.contains(liveBox)) return;
      if (!r.game) {
        liveBox.className = 'livebar live-off';
        liveBox.innerHTML = '<span class="dot"></span><span class="st">Live</span><span class="muted">EVO chiuso — la verifica parte quando lo apri</span>';
      } else if (r.waiting) {
        liveBox.className = 'livebar live-off';
        liveBox.innerHTML = '<span class="dot on"></span><span class="st">EVO aperto</span><span class="muted">— carica una sessione (anche solo prove libere) e la verifica parte da sola</span>';
      } else if (r.check?.rows?.length) {
        const okN = r.check.rows.filter(x=>x.ok).length;
        const cls = r.check.ready ? 'livebar live-ok' : 'livebar live-bad';
        // suono quando TUTTI i pallini diventano verdi (una sola volta per configurazione)
        if (r.check.ready && !window._lastReady) {
          try { new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play().catch(()=>{}); } catch {}
        }
        window._lastReady = !!r.check.ready;
        liveBox.className = cls;
        const det = r.check.rows.map(x=>`<div class="ckrow"><span class="mark">${x.ok?'✅':'❌'}</span><span class="k">${esc(x.key)}</span>${x.ok?`<span class="lv">${esc(x.live)}</span>`:`<span class="exp">${esc(x.expected ?? '?')}</span> <span class="lv" style="color:var(--warn)">${esc(x.live ?? '—')}</span>`}</div>`).join('');
        liveBox.innerHTML = `<span class="dot ${r.check.ready?'on':''}"></span><span class="st">${r.check.ready?'Configurazione corretta!':'Configura in EVO:'}</span>
          <span class="muted">${okN}/${r.check.rows.length} ok</span><div style="width:100%">${det}</div>`;
      } else {
        liveBox.className = 'livebar live-off';
        const s = r.session ?? {};
        liveBox.innerHTML = `<span class="dot on"></span><span class="st">EVO aperto</span><span class="sep">·</span><span class="muted">${esc(s.type ?? '')} · ${esc(s.track ?? '?')} ${esc(s.layout ?? '')} · ${esc(s.session.name || 'sessione libera')}</span>`;
      }
    } catch { /* server occupato: riprova al prossimo giro */ }
    setTimeout(pollLive, 2000);
  };
  pollLive();
  $('#b-race', el).onclick = async () => {
    const btn = $('#b-race', el); btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try {
      const r = await api('race', {car: $('#sel-car', el)?.value});
      const note = r.gameRunning ? 'EVO è già aperto: imposta la gara nella finestra esistente.' : (r.launched && !r.launched.error ? 'Gioco avviato.' : 'Gioco non avviato: aprilo tu.');
      toast(`Gara segnata${r.fee?` · iscrizione ${money(r.fee)} €`:''}. ${note}`, 'ok');
      drawCardInto(el, r.card);
      await refreshBoot();
    } catch(e){ toast(e.message, 'err'); btn.disabled=false; btn.textContent='Iscriviti e apri EVO'; }
  };
}

/* -------- calendario -------- */
async function drawCalendar(m){
  const cal = await api('calendar');

    <div style="margin-bottom:10px">Reputazione richiesta: <b style="color:${repOk?'var(--ok,#7bd88f)':'var(--bad,#e05d5d)'}">${n.repRequired??0}</b> <span class="muted">(la tua: ${n.rep})</span></div>

    ${n.calendar?.length?`<div class="muted" style="margin-top:4px">Distanza gara piena: <b>${Math.max(...n.calendar.map(r=>r.laps??0))} giri</b> max — nel cruscotto puoi accorciare al 25/50/75% (i premi scalano con la distanza)</div>`:''}

function enterFlow(nodeId, name, econ){
  const closed = econ?.access === 'closed';
  const rent = closed ? 0 : (econ?.rent ?? 0);
  const cost = closed
    ? 'Serie a <b>parco chiuso</b>: ci si entra solo con il contratto ufficiale del team — niente affitto né riscatto del sedile, la vettura la mettono loro.'
    : rent > 0
    ? `L'affitto del sedile costa <b>${money(rent)} €</b>, addebitato subito alla firma.`
    : 'Sedile a contratto ufficiale: nessun costo di ingresso.';
  modal('Firma del sedile', `
    <p>Stai per lasciare la serie attuale e trasferirti in <b>${esc(name)}</b>.</p>
    <p class="muted" style="margin-top:8px">${cost} L'iscrizione si paga gara per gara; il calendario riparte dal round 1 della nuova serie.</p>`,
    [['Annulla','ghost',()=>{}], ['Firma il contratto','act', async () => {
      try { const r = await api('enter', {nodeId}); toast('Contratto firmato: ' + r.header.node.display, 'ok'); await refreshBoot(); render(); }
      catch(e){ toast(e.message,'err'); return false; }
    }]]);
}

async function drawArchive(m){
  const c = await api('catalog');
  m.innerHTML = `
  <div class="panel">
    <h2>Archivio sessioni <span class="h-act">${c.archive.total} file nei Results di EVO</span></h2>
    <div class="row"><input type="text" id="arc-q" placeholder="Cerca pista, pilota, sessione…" style="max-width:280px"></div>
    <div id="arc-body"></div>
  </div>`;
  const all = c.archive.rows;
  const rowHtml = (r, tries) => `<tr data-file="${esc(r.file)}" class="arc-row" style="cursor:pointer">
    <td class="muted">${esc(r.when.slice(0,16).replace('T',' '))}</td>
    <td><span class="tag ${r.session==='Race'?'gold':'blue'}">${esc(r.session)}</span></td>
    <td>${esc(r.track)} <span class="faint">${esc(r.layout)}</span></td>
    <td class="muted">${esc(r.kind)}</td>
    <td class="right">${r.drivers}${tries>1?` <span class="faint" title="${tries} tentativi nella stessa ora: clicca per aprire ognuno">×${tries}</span>`:''}</td>
    <td>${r.me ? `<span class="tag ${r.me.position===1?'gold':r.me.position<=3?'green':''}">P${r.me.position}</span>` : '<span class="faint" title="non presente in questa sessione (riprove, spettatore o server)">—</span>'}</td>
    <td class="muted">${esc(r.winner ?? '—')}</td></tr>`;
  const body = $('#arc-body');
  const paint = (q='') => {
    q = q.toLowerCase();
    const rows = all.filter(r=>!q || `${r.track} ${r.session} ${r.winner ?? ''} ${r.kind}`.toLowerCase().includes(q));
    // raggruppa i tentativi ripetuti (stessa ora/sessione/pista): una riga con il
    // migliore, il conteggio dei tentativi e i file tutti apribili dal dettaglio
    const groups = new Map();
    for (const r of rows) {
      const key = `${r.when.slice(0,13)}|${r.session}|${r.track}`;
      (groups.get(key) ?? groups.set(key, []).get(key)).push(r);
    }
    const flat = [...groups.values()].map(g => {
      const best = [...g].sort((a,b)=>(a.me?.position??99)-(b.me?.position??99))[0];
      return { r: best, tries: g.length, files: g.map(x=>x.file) };
    });
    body.innerHTML = flat.length ? `<table><thead><tr><th>Quando</th><th>Sessione</th><th>Pista</th><th>Tipo</th><th class="right">Piloti</th><th>Tu</th><th>Vincitore</th></tr></thead>
    <tbody>${flat.map(({r,tries})=>rowHtml(r,tries)).join('')}</tbody></table><div class="muted" style="margin-top:8px">Clicca una riga per la classificazione completa con tempi e gap. ×N = più tentativi nella stessa ora (si aprono dal dettaglio).</div>`
    : '<div class="empty">Nessuna sessione trovata.</div>';
    $$('.arc-row', body).forEach(tr => tr.onclick = () => openResult(tr.dataset.file));
  };
  paint();
  $('#arc-q').oninput = () => paint($('#arc-q').value);
}

/* -------- statistiche -------- */
function fmtGap(ms){
  if (!Number.isFinite(ms) || ms == null) return '—';
  if (ms >= 60000) return `+${Math.floor(ms/60000)}'${String(Math.round((ms%60000)/1000)).padStart(2,'0')}"`;
  return `+${(ms/1000).toFixed(1)}"`;
}
function svgLine(values, { height=90, color='var(--acc2)', lowerBetter=false }={}){
  const vals = values.filter(v=>v!=null);
  if (vals.length < 2) return vals.length ? `<div style="font-size:32px;font-weight:700;color:${color};padding:8px 0">${vals[0]}</div>` : '';
  const w=560, h=height, pad=8;
  const max=Math.max(...vals), min=Math.min(...vals);
  const span=Math.max(1,max-min);
  const x=(i)=>pad+i*(w-2*pad)/(vals.length-1);
  const y=(v)=> lowerBetter ? pad+(v-min)*(h-2*pad)/span : h-pad-(v-min)*(h-2*pad)/span;
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="${color}"><title>${v}</title></circle>`).join('')}
  </svg>`;
}

async function importCall(body){
  const box = $('#imp-result');
  try {
    const r = await api('import', body);
    await refreshBoot();
    if (r.duplicate || !r.entry) {
      box.innerHTML = `<div class="banner warn"><b>Nessun nuovo risultato registrato</b> — ${esc(r.source ?? 'file già incassato')}<br><span class="muted">I soldi, i punti e il registro rivali restano come erano: niente doppioni.</span></div>`;
      return;
    }
    const e = r.entry;
    box.innerHTML = `<div class="banner good">
      <b>${e.dnf ? 'Ritiro' : 'P'+(e.position ?? '?')} su ${e.gridSize}</b> · R${r.round} di ${esc(r.node)} — ${e.points} punti · premio ${money(e.prize)} € · +${e.rep} rep<br>
      <span class="muted">${esc(r.source)}</span><br>
      Classifica: P${r.standing.before ?? '?'} → <b>P${r.standing.after ?? '?'}</b> (${r.standing.points} punti) · banca ${money(r.money)} €
      ${r.proposal ? `<br>Difficoltà proposta: ${esc(r.proposal.reason)} — trim ${r.proposal.from} → ${r.proposal.to}. Accettala in Difficoltà.` : ''}
      ${r.nudgeSuggested ? `<div class="banner warn" style="margin-top:8px"><b>🚀 Gara troppo facile?</b> ${esc(r.nudgeSuggested.reason)}.<br>
        <button class="mini" id="b-nudge-accept" style="margin-top:6px">Sì, porta la serie a +1</button>
        <span class="muted" style="font-size:11px;margin-left:6px">no, lascia come sta</span></div>` : ''}
      ${r.challenge ? `<br>🎯 Sfida ${r.challenge.won?'<b style="color:var(--good)">vinta</b>':'<b style="color:var(--bad)">persa</b>'}: ${esc(r.challenge.text)} (${r.challenge.won?'+':''}${r.challenge.won ? money(r.challenge.reward) : '−'+r.challenge.penalty+' rep'})` : ''}
      ${r.vendetta?.newNemesi?.length ? `<br>😬 <b>Nuova nemesi:</b> ${esc(r.vendetta.newNemesi.join(', '))} — ti ha battuto due volte di fila.` : ''}
      ${r.vendetta?.settled?.length ? `<br>⚔️ <b>Vendetta assestata</b> su ${esc(r.vendetta.settled.join(', '))}.` : ''}
      ${r.duel ? `<br>⚔️ Duello della stagione: ${esc(r.duel.name)} — tu ${r.duel.myPoints} pt, lui ${r.duel.hisPoints} pt.` : ''}
      ${r.news ? `<br>📰 <b>${esc(r.news.title)}</b><br><span class="muted" style="white-space:pre-wrap">${esc(r.news.body)}</span>` : ''}
      ${r.seasonDone ? '<br><b>Stagione completata!</b> Puoi chiuderla dalla scheda in Cruscotto.' : ''}
      ${r.entry?.sectors ? sectorRowsHtml(r.entry.sectors) : ''}
    </div>`;
  } catch(e){
    const d = e.data || {};
    let extra = '';
    if (d.code === 'PLAYER_NOT_FOUND') extra = `<br>Piloti senza pallino AI: <b>${esc((d.detail?.candidates||[]).join(', '))}</b>. Correggi il nome in Impostazioni, o inserisci a mano.`;
    if (d.code === 'TRACK_MISMATCH') extra = `<br>Gara trovata su <b>${esc(d.detail?.actual)}</b>, attesa su <b>${esc((d.detail?.expected||[]).join(' / '))}</b>.`;
    box.innerHTML = `<div class="banner bad">${esc(e.message)}${extra}</div>`;
  }
  $('#b-nudge-accept', box)?.addEventListener('click', async () => {
    try {
      const out = await api('difficulty-nudge', { delta: 1 });
      const b = $('#b-nudge-accept', box);
      const lo = out?.card?.difficulty?.rangeMin ?? '?', hi = out?.card?.difficulty?.rangeMax ?? '?';
      if (b) { b.disabled = true; b.textContent = `Fatto: banda a ${lo}–${hi}%.`; }
      toast(`Difficoltà della serie portata a ${lo}–${hi}%.`, 'ok');
      await refreshBoot();
    } catch(err){ toast(err.message, 'err'); }
  });
}

function sectorRowsHtml(sec){
  if (!sec?.sectors?.length) return '';
  const w = sec.worstSector ? `Il settore <b>${sec.worstSector.index}</b> ti costa di più (+${(sec.worstSector.deltaMs/1000).toFixed(3)}s sul migliore)` : '';
  return `<div style="margin-top:10px"><b>Settori</b> — tu contro il meglio della griglia${w?` · ${w}`:''}<table style="margin-top:6px"><thead><tr><th>S</th><th class="right">Tuo</th><th class="right">Migliore</th><th>Da chi</th><th class="right">Δ</th><th class="right">Δ media top3</th></tr></thead><tbody>
    ${sec.sectors.map((s,i)=>`<tr><td>S${s.index}</td><td class="right">${s.mineText}</td><td class="right">${s.bestText}</td><td class="muted">${esc(s.bestName??'—')}</td><td class="right">${s.deltaMs==null?'—':(s.deltaMs>=0?'+':'')+(s.deltaMs/1000).toFixed(3)}</td><td class="right">${sec.top3Deltas[i]==null?'—':(sec.top3Deltas[i]>=0?'+':'')+(sec.top3Deltas[i]/1000).toFixed(3)}</td></tr>`).join('')}
    <tr><td class="faint">teorico</td><td class="right"><b>${sec.theoreticalText}</b></td><td class="right">${sec.bestLapText}</td><td colspan="3" class="faint">${sec.theoreticalGainText?`giro teorico ${sec.theoreticalGainText} sotto il tuo best`:''}</td></tr>
  </tbody></table></div>`;
}

async function drawCars(m){
  const b = await api('cars');
  const money = (n) => Number(n ?? 0).toLocaleString('it-IT');
  const inLadder = new Set(b.rows.filter(r=>r.ladderId).map(r=>r.ladderId));
  const nRoad = b.rows.filter(r=>r.category==='road').length;
  const nRacing = b.rows.filter(r=>r.category==='racing').length;
  m.innerHTML = `
  <div class="panel">
    <h2>Libro delle auto <span class="h-act">${b.rows.length} render ufficiali Kunos</span></h2>
    <div class="row" style="align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
      <input id="cars-q" type="text" placeholder="cerca un'auto…" style="flex:1;max-width:280px">
      <div id="cars-cat" style="display:flex;gap:6px">
        <button class="mini" data-cat="" style="border-color:var(--acc)">Tutte (${b.rows.length})</button>
        <button class="mini" data-cat="road">Stradali (${nRoad})</button>
        <button class="mini" data-cat="racing">Racing (${nRacing})</button>
      </div>
      <label class="muted" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="cars-ladder" checked> solo auto del ladder (${inLadder.size})</label>
    </div>
    <div id="cars-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px"></div>
  </div>`;
  let cat = '';
  const draw = () => {
    const q = $('#cars-q').value.toLowerCase();
    const onlyLadder = $('#cars-ladder').checked;
    const rows = b.rows.filter(r => (!cat || r.category===cat) && (!onlyLadder || r.ladderId) && (!q || r.name.toLowerCase().includes(q) || (r.ladderName??'').toLowerCase().includes(q)));
    const piBadge = (pi) => pi==null ? '' : `<span class="tag blue" style="font-size:10px;padding:1px 6px" title="Perf. index dal server dedicato">PI ${pi.toFixed(1)}</span>`;
    $('#cars-grid').innerHTML = rows.map((r,i)=>{
      const eco = r.ladderId ? b.economy?.[r.ladderId] : null;
      const inGar = r.ladderId && b.inGarage?.includes(r.ladderId);
      const price = r.realPrice != null
        ? `<div style="margin-top:6px"><span class="tag gold" style="font-size:12px;padding:2px 8px" title="prezzo reale indicativo (listino o mercato)">💰 ${money(r.realPrice)} €</span></div>`
        : (eco?.buy != null
          ? `<div style="margin-top:6px"><span class="tag gold" style="font-size:12px;padding:2px 8px" title="prezzo di gioco (serie più conveniente)">💰 ${money(eco.buy)} € <span class="muted" style="font-weight:400">(di gioco)</span></span></div>`
          : `<div class="muted" style="margin-top:6px;font-size:11px">prezzo non noto</div>`);
      return `<div class="panel car-click" data-i="${rows.indexOf(r)}" style="padding:0;overflow:hidden;cursor:pointer" title="clicca per tutti i dettagli">
      <img class="car-frame" src="${r.image}" alt="${esc(r.name)}" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0d1118">
      <div style="padding:8px 10px"><b style="font-size:12.5px">${esc(r.name)}</b> ${piBadge(r.pi)} <span class="faint" style="font-size:10px">${r.category==='racing'?' racing':' stradale'}</span>${inGar?' <span class="tag gold" style="font-size:10px;padding:1px 6px" title="già nel tuo garage">🏠 garage</span':''}
      ${price}
      ${r.specs?.power!=null?`<div class="muted" style="font-size:11px;margin-top:4px">${r.specs.power} CV · ${r.specs.weight!=null?r.specs.weight+' kg · ':''}${esc(r.specs.drive??'')}</div>`:''}
      ${r.variants?.length?`<div class="muted" style="font-size:11px;margin-top:2px">varianti: ${esc(r.variants.join(', '))}</div>`:''}</div>
    </div>`;
    }).join('') || '<div class="empty">Nessuna auto trovata.</div>';
    $$('#cars-grid .car-click').forEach(el => el.onclick = () => carDetail(rows[Number(el.dataset.i)], b));
  };

  /* grafico curve motore: potenza in kW (linea piena) e coppia in Nm (tratteggiata) */
  function curveChart(spec){
    const P = spec.powerCurve, T = spec.torqueCurve;
    if (!P?.length && !T?.length) return '';
    const kW = (hp) => hp * 0.7355;
    const rpms = [...(P ?? []), ...(T ?? [])].map((p) => p[0]);
    const minR = Math.min(...rpms), maxR = Math.max(...rpms);
    if (maxR <= minR) return '';
    const maxP = P?.length ? Math.max(...P.map((p) => kW(p[1]))) : 0;
    const maxT = T?.length ? Math.max(...T.map((p) => p[1])) : 0;
    const W = 470, H = 160, PAD = 30;
    const x = (r) => PAD + (r - minR) / (maxR - minR) * (W - 2 * PAD);
    const yP = (v) => H - PAD - (v / (maxP || 1)) * (H - 2 * PAD);
    const yT = (v) => H - PAD - (v / (maxT || 1)) * (H - 2 * PAD);
    const line = (arr, yf) => arr.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${yf(p[1]).toFixed(1)}`).join(' ');
    return `<div style="margin-top:10px">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#0d1118;border:1px solid var(--line);border-radius:8px">
        <line x1="${PAD}" y1="${H-PAD}" x2="${W-PAD/2}" y2="${H-PAD}" stroke="var(--line2)"/>
        <text x="${PAD}" y="14" fill="#8fa" font-size="11">potenza kW</text>
        <text x="${W-110}" y="14" fill="#f96" font-size="11">coppia Nm</text>
        <text x="${PAD}" y="${H-8}" fill="var(--dim)" font-size="10">${minR} giri/min</text>
        <text x="${W-PAD-60}" y="${H-8}" fill="var(--dim)" font-size="10">${maxR} giri/min</text>
        ${T?.length?`<path d="${line(T, yT)}" fill="none" stroke="#f96" stroke-width="2" stroke-dasharray="5 4"/>`:''}
        ${P?.length?`<path d="${line(P, yP)}" fill="none" stroke="#8fa" stroke-width="2.4"/>`:''}
      </svg>
      <div class="muted" style="font-size:11px;margin-top:3px">Picchi: ${maxP?maxP.toFixed(0)+' kW':'—'} · ${maxT?maxT.toFixed(0)+' Nm':'—'} (curve dall'installazione di Assetto Corsa 1)</div>
    </div>`;
  }

  /* finestra dettagli auto: scheda tecnica completa, grafico, economia e garage */
  function carDetail(r, book){
    const eco = r.ladderId ? book.economy?.[r.ladderId] : null;
    const inGar = r.ladderId && book.inGarage?.includes(r.ladderId);
    const s = r.specs ?? null;
    const row = (k, v) => v != null && v !== '' && v !== '—' ? `<div style="display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${k}</span><b style="text-align:right">${v}</b></div>` : '';
    modal(r.name, `
      <img src="${r.image}" alt="${esc(r.name)}" style="width:100%;border-radius:10px;background:#0d1118;margin-bottom:12px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        <span class="tag ${r.category==='racing'?'blue':''}">${r.category==='racing'?'racing':'stradale'}</span>
        ${r.pi!=null?`<span class="tag blue">PI ${r.pi.toFixed(1)}</span>`:''}
        ${r.realPrice!=null?`<span class="tag gold" title="prezzo reale indicativo">💰 ~${money(r.realPrice)} € reali</span>`:(eco?.buy!=null?`<span class="tag gold">💰 acquisto ${money(eco.buy)} € (gioco)</span>`:'')}
        ${inGar?'<span class="tag gold">🏠 nel tuo garage</span>':''}
      </div>
      ${s ? `
      <h3 style="margin:4px 0 2px;font-size:13px">Scheda tecnica</h3>
      ${row('Potenza', s.power!=null?`${s.power} CV (${(s.power*0.7355).toFixed(0)} kW)`:null)}
      ${row('Coppia', s.torque!=null?`${s.torque} Nm`:null)}
      ${row('Peso', s.weight!=null?`${s.weight} kg`:null)}
      ${row('Peso/potenza', s.pwratio!=null?esc(String(s.pwratio)):(s.power&&s.weight?`${(s.weight/s.power).toFixed(2)} kg/CV`:null))}
      ${row('Trazione', s.drive?esc(s.drive):null)}
      ${row('Cambio', s.gearbox?esc(s.gearbox):null)}
      ${row('Velocità massima', s.topspeed?esc(String(s.topspeed)):null)}
      ${row('Accelerazione', s.acceleration?esc(String(s.acceleration)):null)}
      ${row('Anno', s.year??null)}
      ${row('Nazione', s.country?esc(s.country):null)}
      ${curveChart(s)}` : '<div class="muted" style="margin-top:8px;font-size:12px">Scheda tecnica non disponibile per questo modello.</div>'}
      <h3 style="margin:14px 0 2px;font-size:13px">Nella carriera</h3>
      ${row('Nome nella carriera', r.ladderName ? esc(r.ladderName) : (r.ladderId ? esc(r.ladderId) : null))}
      ${row('Prezzo reale indicativo', r.realPrice != null ? money(r.realPrice) + ' €' : null)}
      ${row('Acquisto sedile (gioco)', eco?.buy != null ? money(eco.buy) + ' €' : null)}
      ${row('Iscrizione per gara (da)', eco?.entry != null ? money(eco.entry) + ' €' : null)}
      ${row('Premio di gara (fino a)', eco?.prize != null ? money(eco.prize) + ' €' : null)}
      ${row('Varianti disponibili', r.variants?.length ? esc(r.variants.join(', ')) : null)}
      ${eco?.series?.length ? `<div class="muted" style="margin-top:10px;font-size:12px">Serie dove puoi correrla: ${eco.series.map(esc).join(' · ')}</div>` : '<div class="muted" style="margin-top:10px;font-size:12px">Questa auto non è usata dalle serie di carriera: la puoi solo aggiungere al garage.</div>'}
      ${r.shTop!=null?`<div class="muted" style="margin-top:6px;font-size:12px">Baseline telemetry (SH) top: ${(r.shTop*100).toFixed(1)}%</div>`:''}
    `, [['Chiudi','ghost',()=>{}]]);
  }
  $$('#cars-cat button').forEach(btn => btn.onclick = () => {
    cat = btn.dataset.cat;
    $$('#cars-cat button').forEach(x => x.style.borderColor = x===btn ? 'var(--acc)' : '');
    draw();
  });
  $('#cars-q').oninput = draw;
  $('#cars-ladder').onchange = draw;
  draw();
}
